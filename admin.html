<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>સત્સંગ બોક્સ આંકડા</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#4a2c1c;--muted:#7a5a44;--line:rgba(140,100,60,.22);--bar:#c8623a;--track:rgba(150,100,60,.14);--card:linear-gradient(160deg,#fdf5e8,#f3e3cb);--bd:1px solid rgba(255,255,255,.75);--sh:0 .4rem 1rem rgba(120,80,40,.18),inset 0 2px 3px #fff;--blur:none;
--page:linear-gradient(rgba(248,235,214,.86),rgba(240,218,186,.92)),#f4e3cc url(themes/adhyatmik/mati/bg.webp) center top/cover fixed}
html.cl{--ink:#26364f;--muted:#55657f;--line:rgba(80,100,130,.18);--bar:#3f7fa6;--track:rgba(70,100,130,.12);--card:linear-gradient(150deg,rgba(255,255,255,.72),rgba(255,255,255,.4));--bd:1px solid rgba(255,255,255,.9);--sh:0 .7rem 1.5rem rgba(70,100,130,.14);--blur:blur(16px) saturate(1.4);
--page:radial-gradient(90% 50% at 10% 0,#ffe6d6,transparent),radial-gradient(90% 55% at 100% 30%,#d5e8ff,transparent),radial-gradient(90% 55% at 0 100%,#d9f2e4,transparent),#e6f2ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--page);background-attachment:fixed;color:var(--ink);font:500 16px/1.45 'Noto Sans Gujarati','Hind Vadodara',sans-serif}
.wrap{max-width:560px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px 28px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
h1{font:700 24px/1.2 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;margin:0;flex:1}
.x{width:44px;height:44px;border:var(--bd);border-radius:14px;background:var(--card);box-shadow:var(--sh);color:var(--ink);font-size:20px;text-decoration:none;display:grid;place-items:center;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.note{font-size:14px;color:var(--muted);margin:-6px 0 12px}
.card{background:var(--card);border:var(--bd);border-radius:20px;box-shadow:var(--sh);padding:14px;margin-bottom:12px;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
h2{font:700 18px/1.3 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;margin:0 0 10px}
.hero{display:flex;align-items:baseline;gap:10px}
.hero b{font:800 46px/1 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif}
.hero span{font-size:16px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{border-top:1px solid var(--line);padding-top:8px}
.tile b{display:block;font:700 24px/1.15 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif}
.tile small{font-size:13px;color:var(--muted)}
.ret{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15px}
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line)}
.col{flex:1;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0;cursor:pointer}
.col i{display:block;width:100%;min-height:2px;background:var(--bar);border-radius:3px 3px 0 0;opacity:.75}
.col.on i{opacity:1}
.read{font-size:15px;min-height:22px;margin-bottom:6px}.read b{font-weight:700}
.ax{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.game{padding:10px 0;border-top:1px solid var(--line)}.game:first-of-type{border-top:0;padding-top:0}
.gh{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.gh span:last-child{font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--track);margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.gs{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row{margin-bottom:8px;font-size:14px}.row:last-child{margin-bottom:0}
.row div:first-child{display:flex;justify-content:space-between;gap:6px}
.row .bar{margin:3px 0 0}
.sm{font-size:14px;color:var(--muted);text-align:center;margin:4px 0 0}
.srch{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.45);color:var(--ink);font:inherit;padding:8px 12px;margin-bottom:6px}
.srch::placeholder{color:var(--muted)}
.u{border-top:1px solid var(--line)}.u:first-of-type{border-top:0}
.ub{width:100%;min-height:44px;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:9px 0;cursor:pointer;display:block}
.ur{display:flex;justify-content:space-between;gap:8px;font-weight:700}.ur span:first-child{min-width:0;overflow-wrap:anywhere}.ur span:last-child{white-space:nowrap}
.um{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.ud{padding:0 0 10px;font-size:14px}.ud div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.ov{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--page);background-attachment:fixed}
.hd{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.hd:first-of-type{border-top:0}
.hd .ic{flex:none;width:22px;text-align:center}.hd .tx{flex:1;min-width:0}.hd .tx b{display:block;font-weight:700}.hd .tx small{font-size:14px;color:var(--muted)}
.hd .tm{white-space:nowrap;font-weight:600;text-align:right}.ct{display:block;font-size:14px;font-weight:500;color:var(--muted)}
#err{display:none;font-weight:600;text-align:center}
.mk{display:block;min-height:36px;margin-top:4px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:none;color:inherit;font:600 13px 'Noto Sans Gujarati',sans-serif;cursor:pointer}
.fb.rd{opacity:.6}.ms{overflow-wrap:anywhere;white-space:pre-wrap}
span.col{cursor:default}
html,body{height:100%;overflow:hidden}
.app{height:100vh;height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 12px 0;position:relative}
.app header{margin-bottom:6px}.app h1{font-size:20px}.app .x{width:40px;height:40px}
#pg{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
#pg .card{padding:10px 12px;margin-bottom:8px}#pg h2{font-size:16px;margin:0 0 6px}#pg h2 small{font-weight:600;font-size:13px;color:var(--muted);margin-left:6px}
#pg .hero b{font-size:36px}#pg .hero .rt{margin-left:auto;font-size:14px}.hero span{font-size:15px}
#pg .tiles{margin-top:8px}#pg .tile b{font-size:21px}
.chart.s{height:56px}.chart.s2{height:46px;gap:0}.chart.s2 .col{display:flex}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}.wk small{font-size:12px;color:var(--muted)}
.mini{display:flex;flex-direction:column;align-items:flex-start;gap:0;color:inherit;font:inherit;text-align:left;width:100%;margin:0}.mini b{font:800 28px/1.1 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif}.mini small{font-size:13px;color:var(--muted)}
button.go{cursor:pointer}
.two{margin-bottom:0}.two .card{margin-bottom:8px}
.hl2{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}.hl2:first-child{border-top:0}.hl2 span{color:var(--muted)}.hl2 b{text-align:right}
.game{padding:7px 0}.gs{font-size:13px}.bar{margin:4px 0}
#pg .row{margin-bottom:6px}
.pgr{display:flex;align-items:center;justify-content:center;gap:16px;padding-top:6px;font-weight:700}
.pgr button{width:48px;height:40px;border:1px solid var(--line);border-radius:12px;background:none;color:inherit;font:700 20px/1 sans-serif;cursor:pointer}.pgr button:disabled{opacity:.3}
.ms{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ub{min-height:44px;padding:6px 0}.srch{min-height:40px;margin-bottom:4px}
#upd{font-size:12px;margin:2px 0}
#nav{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:6px 0 max(8px,env(safe-area-inset-bottom))}
#nav button{min-height:50px;border:var(--bd);border-radius:14px;background:var(--card);box-shadow:var(--sh);color:var(--muted);font:600 11px/1.1 'Noto Sans Gujarati',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
#nav button i{font-style:normal;font-size:18px;line-height:1}
#nav button.on{color:var(--ink);outline:2px solid var(--bar);outline-offset:-2px}
#pg.inr{animation:inr .22s ease-out}#pg.inl{animation:inl .22s ease-out}@keyframes inr{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}@keyframes inl{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){#pg.inr,#pg.inl{animation:none}}
#fbb{display:none;position:absolute;right:3px;top:0;min-width:18px;height:18px;border-radius:9px;background:#c0392b;color:#fff;font:700 11px/18px sans-serif;text-align:center;padding:0 4px;pointer-events:none}
@media(max-width:350px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><h1>📊 સત્સંગ બોક્સ આંકડા</h1><a class="x" href="./" aria-label="પાછા">✕</a></header>
<div class="note" id="note"></div>
<section class="card" id="err"></section>
<main id="pg"></main>
<p class="sm" id="upd"></p>
<nav id="nav"><button data-t="sum"><i>📊</i>સારાંશ</button><button data-t="game"><i>🎮</i>ગેમ</button><button data-t="user"><i>👥</i>ભક્તો</button><button data-t="more"><i>🌍</i>વધુ</button><button data-t="fb"><i>💬</i>ફીડબેક</button><span id="fbb"></span></nav>
</div>
<script src="box.js"></script>
<script src="auth.js"></script>
<script>
(function(){
var GAMES={"prashn-leela":"સત્સંગ પ્રશ્ન","dhyan-murti":"ધ્યાન દર્શન","antahshatru-vijay":"અંતઃશત્રુ વિજય","fal-ful-memory":"ફળ ફૂલ મેમરી","ekadashi":"એકાદશી"};
var LANGS={g:"ગુજરાતી",e:"English",r:"ABC"},THEMES={mati:"આધ્યાત્મિક",kaach:"ક્લાસિક"},UNK="નોંધાયું નથી";
var MON=["જાન્યુ","ફેબ્રુ","માર્ચ","એપ્રિ","મે","જૂન","જુલા","ઑગ","સપ્ટે","ઑક્ટો","નવે","ડિસે"];
function gu(n){return String(n).replace(/\d/g,function(d){return "૦૧૨૩૪૫૬૭૮૯"[d]})}
function num(n){return gu(Number(n||0).toLocaleString("en-IN"))}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function dur(s){if(!s)return "—";var t=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.round(s%60);return t?gu(t)+" ક "+gu(m)+" મિ":m?gu(m)+" મિ "+gu(x)+" સે":gu(x)+" સે"}
function day(s){var p=s.split("-");return gu(+p[2])+" "+MON[+p[1]-1]}
function rows(o,names,sum,lim){var a=Object.keys(o).map(function(k){return [names[k]||(k==="unknown"?UNK:k),o[k]]}).sort(function(x,y){return y[1]-x[1]}).slice(0,lim||99);
 return a.map(function(r){var p=sum?Math.round(r[1]*100/sum):0;return '<div class="row"><div><span>'+esc(r[0])+'</span><b>'+gu(p)+'%</b></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("")}
var ORD=["sum","game","user","more","fb"],DIR=0;
function go(t){var a=ORD.indexOf(S.tab),b=ORD.indexOf(t);if(a===b)return;DIR=b>a?1:-1;S.tab=t;draw()}
var S={tab:"sum",d:null,users:null,x:null,fb:null,q:"",up:0,fp:0},UP=4,FP=3;
function pct(n,sum){return sum?Math.round(n*100/sum):0}
function byCountry(x){var by={},tot=0;((x&&x.time_zones)||[]).forEach(function(z){var c=z.time_zone==="unknown"?UNK:(country(z.time_zone)||UNK);by[c]=(by[c]||0)+z.plays;tot+=z.plays});return {by:by,tot:tot}}
function pager(key,n,per){var pages=Math.max(1,Math.ceil(n/per));if(S[key]>=pages)S[key]=pages-1;if(pages<2)return "";
 return '<div class="pgr"><button data-pg="'+key+'" data-s="-1"'+(S[key]<=0?" disabled":"")+' aria-label="પાછળ">‹</button><span>'+gu(S[key]+1)+' / '+gu(pages)+'</span><button data-pg="'+key+'" data-s="1"'+(S[key]>=pages-1?" disabled":"")+' aria-label="આગળ">›</button></div>'}
function bindPg(root){[].forEach.call(root.querySelectorAll("[data-pg]"),function(b){b.addEventListener("click",function(){S[b.dataset.pg]+=+b.dataset.s;if(b.dataset.pg==="up")fillUsers();else draw()})})}
function tabSum(){var d=S.d,x=S.x||{},total=d.total_users||0,ret=pct(d.returning_users,total),h="";
 h+='<section class="card"><div class="hero"><b>'+num(total)+'</b><span>કુલ ભક્તો</span><span class="rt">🔁 '+gu(ret)+'% પાછા આવ્યા</span></div><div class="tiles">'+
  '<div class="tile"><b>'+num(d.active_today)+'</b><small>આજે રમ્યા</small></div><div class="tile"><b>'+num(d.active_7_days)+'</b><small>૭ દિવસમાં</small></div><div class="tile"><b>'+num(d.active_30_days)+'</b><small>૩૦ દિવસમાં</small></div></div></section>';
 var nu=d.new_users_by_day||[],nm=1,sum=0;nu.forEach(function(r){if(r.count>nm)nm=r.count;sum+=r.count});
 h+='<section class="card"><h2>નવા ભક્તો <small>૩૦ દિવસમાં +'+num(sum)+'</small></h2>';
 if(nu.length)h+='<div class="chart s">'+nu.map(function(r){return '<span class="col"><i style="height:'+Math.max(3,r.count*100/nm)+'%"></i></span>'}).join("")+'</div><div class="ax"><span>'+day(nu[0].day)+'</span><span>'+day(nu[nu.length-1].day)+'</span></div>';
 else h+='<div class="sm">હજી કોઈ નવા ભક્ત નથી</div>';
 h+='</section>';
 var st=x.stars||{},un=x.unread_feedback||0;
 h+='<div class="two"><section class="card mini"><small>⭐ ગેમના તારા</small>'+(st.count?'<b>'+gu(st.average)+'</b><small>'+num(st.count)+' મત</small>':'<b>—</b><small>હજી મત નથી</small>')+'</section>'+
  '<button class="card mini go" data-go="fb"><small>💬 ફીડબેક</small><b>'+num(un)+'</b><small>નવા ›</small></button></div>';
 var g=(d.games||[]).slice().sort(function(a,b){return b.starts-a.starts})[0],c=byCountry(x),ck=Object.keys(c.by).sort(function(a,b){return c.by[b]-c.by[a]})[0],hrs=x.by_hour||[],mx=0,mi=0;hrs.forEach(function(r,i){if(r.plays>mx){mx=r.plays;mi=i}});
 h+='<section class="card"><div class="hl2"><span>🎮 મુખ્ય ગેમ</span><b>'+(g?esc(GAMES[g.game]||g.game)+' · '+num(g.starts):'—')+'</b></div><div class="hl2"><span>🌍 મુખ્ય દેશ</span><b>'+(ck?esc(ck):'—')+'</b></div><div class="hl2"><span>🕘 સૌથી વધુ સમય</span><b>'+(mx?hour(mi):'—')+'</b></div></section>';
 return h}
function tabGame(){var d=S.d,x=S.x||{},max=1,sg={};(d.games||[]).forEach(function(g){if(g.starts>max)max=g.starts});(x.stars_by_game||[]).forEach(function(r){sg[r.game]=r});
 var h='<section class="card"><h2>ગેમ પ્રમાણે</h2>';
 (d.games||[]).forEach(function(g){var s=sg[g.game];h+='<div class="game"><div class="gh"><span>'+esc(GAMES[g.game]||g.game)+'</span><span>'+num(g.starts)+' વાર</span></div><div class="bar"><i style="width:'+Math.round(g.starts*100/max)+'%"></i></div><div class="gs"><span>✓ '+gu(g.completion_percent)+'%</span><span>⏱ '+dur(g.average_seconds)+'</span><span>'+(s?'⭐ '+gu(s.average)+' ('+num(s.count)+')':'⭐ —')+'</span></div></div>'});
 if(!(d.games||[]).length)h+='<div class="sm">હજી કોઈ ગેમ રમાઈ નથી</div>';
 return h+'</section>'}
function tabUsers(){var n=(S.users||[]).length;return '<section class="card"><h2>ભક્તો <small>'+num(n)+'</small></h2><input class="srch" type="search" placeholder="નામ કે ઈમેઇલથી શોધો" aria-label="શોધો" value="'+esc(S.q)+'"><div id="ulist"></div><div id="upg"></div></section>'}
function fillUsers(){var box=document.getElementById("ulist");if(!box)return;var q=(S.q||"").trim().toLowerCase();
 var a=(S.users||[]).filter(function(u){return !q||String(u.name||"").toLowerCase().indexOf(q)>=0||String(u.email||"").toLowerCase().indexOf(q)>=0});
 var pg=pager("up",a.length,UP),page=a.slice(S.up*UP,S.up*UP+UP);
 box.innerHTML=page.length?page.map(function(u,i){return '<div class="u"><button class="ub" data-i="'+i+'"><div class="ur"><span>'+esc(u.name||u.email||"નામ નથી")+'</span><span>'+num(u.plays)+' વાર ›</span></div><div class="um">'+esc(u.email||"👤 મહેમાન")+'</div><div class="um">✓ '+num(u.finishes)+' પૂરી · ⏱ '+dur(u.total_seconds)+' · છેલ્લે '+when(u.last_played)+'</div></button></div>'}).join(""):'<div class="sm">કોઈ મળ્યું નહીં</div>';
 box.querySelectorAll(".ub").forEach(function(b){b.addEventListener("click",function(){openUser(page[+b.dataset.i])})});
 var w=document.getElementById("upg");w.innerHTML=pg;bindPg(w)}
function tabMore(){var d=S.d,x=S.x||{},total=d.total_users||0,c=byCountry(x),h="";
 var th=d.themes||{},tl=Object.keys(th).sort(function(a,b){return th[b]-th[a]}).map(function(k){return esc(THEMES[k]||k)+' '+gu(pct(th[k],total))+'%'}).join(' · ');
 h+='<div class="two"><section class="card"><h2>🌍 દેશ</h2>'+(c.tot?rows(c.by,{},c.tot,3):'<div class="sm">હજી આંકડા નથી</div>')+'</section><section class="card"><h2>🗣 ભાષા</h2>'+rows(d.languages||{},LANGS,total,3)+(tl?'<div class="sm">🎨 '+tl+'</div>':'')+'</section></div>';
 var hrs=x.by_hour||[],mx=0,mi=0;hrs.forEach(function(r,i){if(r.plays>mx){mx=r.plays;mi=i}});
 h+='<section class="card"><h2>🕘 કયા સમયે <small>'+(mx?hour(mi)+' સૌથી વધુ':'હજી આંકડા નથી')+'</small></h2><div class="chart s">'+hrs.map(function(r,i){return '<span class="col'+(i===mi&&mx?" on":"")+'"><i style="height:'+(mx?Math.max(3,r.plays*100/mx):3)+'%"></i></span>'}).join("")+'</div><div class="ax"><span>૧૨ રાત</span><span>૧૨ બપોર</span><span>૧૧ રાત</span></div></section>';
 var W=["રવિ","સોમ","મંગળ","બુધ","ગુરુ","શુક્ર","શનિ"],wd=x.by_weekday||[],wm=1;wd.forEach(function(r){if(r.plays>wm)wm=r.plays});
 h+='<section class="card"><h2>📅 કયા વારે</h2><div class="wk">'+wd.map(function(r){return '<div><div class="chart s2"><span class="col"><i style="height:'+Math.max(3,r.plays*100/wm)+'%"></i></span></div><small>'+W[r.weekday]+'</small></div>'}).join("")+'</div></section>';
