<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>સત્સંગ બોક્સ આંકડા</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#4a2c1c;--muted:#7a5a44;--line:rgba(140,100,60,.22);--bar:#c8623a;--track:rgba(150,100,60,.14);--card:linear-gradient(160deg,#fdf5e8,#f3e3cb);--bd:1px solid rgba(255,255,255,.75);--sh:0 .4rem 1rem rgba(120,80,40,.18),inset 0 2px 3px #fff;--blur:none;
--page:linear-gradient(rgba(248,235,214,.86),rgba(240,218,186,.92)),#f4e3cc url(themes/adhyatmik/mati/bg.webp) center top/cover fixed}
html.cl{--ink:#26364f;--muted:#55657f;--line:rgba(80,100,130,.18);--bar:#3f7fa6;--track:rgba(70,100,130,.12);--card:linear-gradient(150deg,rgba(255,255,255,.72),rgba(255,255,255,.4));--bd:1px solid rgba(255,255,255,.9);--sh:0 .7rem 1.5rem rgba(70,100,130,.14);--blur:blur(16px) saturate(1.4);
--page:radial-gradient(90% 50% at 10% 0,#ffe6d6,transparent),radial-gradient(90% 55% at 100% 30%,#d5e8ff,transparent),radial-gradient(90% 55% at 0 100%,#d9f2e4,transparent),#e6f2ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--page);background-attachment:fixed;color:var(--ink);font:500 16px/1.45 'Noto Sans Gujarati','Hind Vadodara',sans-serif}
.wrap{max-width:560px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px 28px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
h1{font:700 24px/1.2 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;margin:0;flex:1}
.x{width:44px;height:44px;border:var(--bd);border-radius:14px;background:var(--card);box-shadow:var(--sh);color:var(--ink);font-size:20px;text-decoration:none;display:grid;place-items:center;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.note{font-size:14px;color:var(--muted);margin:-6px 0 12px}
.card{background:var(--card);border:var(--bd);border-radius:20px;box-shadow:var(--sh);padding:14px;margin-bottom:12px;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
h2{font:700 18px/1.3 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;margin:0 0 10px}
.hero{display:flex;align-items:baseline;gap:10px}
.hero b{font:800 46px/1 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif}
.hero span{font-size:16px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{border-top:1px solid var(--line);padding-top:8px}
.tile b{display:block;font:700 24px/1.15 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif}
.tile small{font-size:13px;color:var(--muted)}
.ret{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15px}
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line)}
.col{flex:1;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0;cursor:pointer}
.col i{display:block;width:100%;min-height:2px;background:var(--bar);border-radius:3px 3px 0 0;opacity:.75}
.col.on i{opacity:1}
.read{font-size:15px;min-height:22px;margin-bottom:6px}.read b{font-weight:700}
.ax{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.game{padding:10px 0;border-top:1px solid var(--line)}.game:first-of-type{border-top:0;padding-top:0}
.gh{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.gh span:last-child{font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--track);margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.gs{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row{margin-bottom:8px;font-size:14px}.row:last-child{margin-bottom:0}
.row div:first-child{display:flex;justify-content:space-between;gap:6px}
.row .bar{margin:3px 0 0}
.sm{font-size:14px;color:var(--muted);text-align:center;margin:4px 0 0}
.srch{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.45);color:var(--ink);font:inherit;padding:8px 12px;margin-bottom:6px}
.srch::placeholder{color:var(--muted)}
.u{border-top:1px solid var(--line)}.u:first-of-type{border-top:0}
.ub{width:100%;min-height:44px;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:9px 0;cursor:pointer;display:block}
.ur{display:flex;justify-content:space-between;gap:8px;font-weight:700}.ur span:first-child{min-width:0;overflow-wrap:anywhere}.ur span:last-child{white-space:nowrap}
.um{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.ud{padding:0 0 10px;font-size:14px}.ud div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.ov{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--page);background-attachment:fixed}
.hd{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.hd:first-of-type{border-top:0}
.hd .ic{flex:none;width:22px;text-align:center}.hd .tx{flex:1;min-width:0}.hd .tx b{display:block;font-weight:700}.hd .tx small{font-size:14px;color:var(--muted)}
.hd .tm{white-space:nowrap;font-weight:600;text-align:right}.ct{display:block;font-size:14px;font-weight:500;color:var(--muted)}
#err{display:none;font-weight:600;text-align:center}
.mk{display:block;min-height:36px;margin-top:4px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:none;color:inherit;font:600 13px 'Noto Sans Gujarati',sans-serif;cursor:pointer}
.fb.rd{opacity:.6}.ms{overflow-wrap:anywhere;white-space:pre-wrap}
span.col{cursor:default}
@media(max-width:350px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>📊 સત્સંગ બોક્સ આંકડા</h1><a class="x" href="./" aria-label="પાછા">✕</a></header>
<div class="note" id="note"></div>

<section class="card" id="err"></section>
<div id="app"></div>
<p class="sm" id="upd"></p>
</div>
<script src="box.js"></script>
<script src="auth.js"></script>
<script>
(function(){
var GAMES={"prashn-leela":"સત્સંગ પ્રશ્ન","dhyan-murti":"ધ્યાન દર્શન","antahshatru-vijay":"અંતઃશત્રુ વિજય","fal-ful-memory":"ફળ ફૂલ મેમરી","ekadashi":"એકાદશી"};
var LANGS={g:"ગુજરાતી",e:"English",r:"ABC"},THEMES={mati:"આધ્યાત્મિક",kaach:"ક્લાસિક"},UNK="નોંધાયું નથી";
var MON=["જાન્યુ","ફેબ્રુ","માર્ચ","એપ્રિ","મે","જૂન","જુલા","ઑગ","સપ્ટે","ઑક્ટો","નવે","ડિસે"];
function gu(n){return String(n).replace(/\d/g,function(d){return "૦૧૨૩૪૫૬૭૮૯"[d]})}
function num(n){return gu(Number(n||0).toLocaleString("en-IN"))}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function dur(s){if(!s)return "—";var t=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.round(s%60);return t?gu(t)+" ક "+gu(m)+" મિ":m?gu(m)+" મિ "+gu(x)+" સે":gu(x)+" સે"}
function day(s){var p=s.split("-");return gu(+p[2])+" "+MON[+p[1]-1]}
function rows(o,names,sum){var a=Object.keys(o).map(function(k){return [names[k]||(k==="unknown"?UNK:k),o[k]]}).sort(function(x,y){return y[1]-x[1]});
 return a.map(function(r){var p=sum?Math.round(r[1]*100/sum):0;return '<div class="row"><div><span>'+esc(r[0])+'</span><b>'+gu(p)+'%</b></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("")}
function render(d){
 var total=d.total_users||0,ret=total?Math.round(d.returning_users*100/total):0,max=1,h="";
 (d.games||[]).forEach(function(g){if(g.starts>max)max=g.starts});
 h+='<section class="card"><div class="hero"><b>'+num(total)+'</b><span>કુલ ભક્તો જોડાયા</span></div><div class="tiles">'+
  '<div class="tile"><b>'+num(d.active_today)+'</b><small>આજે રમ્યા</small></div><div class="tile"><b>'+num(d.active_7_days)+'</b><small>૭ દિવસમાં</small></div><div class="tile"><b>'+num(d.active_30_days)+'</b><small>૩૦ દિવસમાં</small></div></div>'+
  '<div class="ret">🔁 <b>'+gu(ret)+'%</b> ભક્તો બીજા દિવસે પણ પાછા આવ્યા ('+num(d.returning_users)+')</div></section>';
 var nu=d.new_users_by_day||[],nm=1,sum=0;nu.forEach(function(x){if(x.count>nm)nm=x.count;sum+=x.count});
 h+='<section class="card"><h2>નવા જોડાયેલા ભક્તો (૩૦ દિવસ)</h2>';
 if(nu.length){h+='<div class="read" id="read"></div><div class="chart">'+nu.map(function(x,i){return '<button class="col" data-i="'+i+'" aria-label="'+esc(day(x.day))+': '+x.count+'"><i style="height:'+Math.max(2,x.count*100/nm)+'%"></i></button>'}).join("")+'</div><div class="ax"><span>'+day(nu[0].day)+'</span><span>'+day(nu[nu.length-1].day)+'</span></div>'}
 else h+='<div class="sm">હજી કોઈ નવા ભક્ત નથી</div>';
 h+='</section><section class="card"><h2>ગેમ પ્રમાણે</h2>';
 (d.games||[]).forEach(function(g){h+='<div class="game"><div class="gh"><span>'+esc(GAMES[g.game]||g.game)+'</span><span>'+num(g.starts)+' વાર</span></div><div class="bar"><i style="width:'+Math.round(g.starts*100/max)+'%"></i></div><div class="gs"><span>✓ '+gu(g.completion_percent)+'% પૂરી કરી</span><span>⏱ સરેરાશ '+dur(g.average_seconds)+'</span></div></div>'});
 if(!(d.games||[]).length)h+='<div class="sm">હજી કોઈ ગેમ રમાઈ નથી</div>';
 h+='</section><div class="two"><section class="card"><h2>ભાષા</h2>'+rows(d.languages||{},LANGS,total)+'</section><section class="card"><h2>થીમ</h2>'+rows(d.themes||{},THEMES,total)+'</section></div>';
 document.getElementById("app").innerHTML=h;
 if(nu.length){var R=document.getElementById("read"),C=document.querySelectorAll(".col");
  function pick(i){C.forEach(function(c){c.classList.remove("on")});C[i].classList.add("on");R.innerHTML='<b>'+day(nu[i].day)+'</b>: '+num(nu[i].count)+' નવા ભક્ત'}
  C.forEach(function(c){c.addEventListener("click",function(){pick(+c.dataset.i)})});pick(nu.length-1)}
}
function when(s){if(!s)return "હજી રમ્યા નથી";var d=new Date(s),p=new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Adelaide",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);return day(p)}
function users(list,q){var box=document.getElementById("ulist");if(!box)return;q=(q||"").trim().toLowerCase();
 var a=list.filter(function(u){return !q||String(u.name||"").toLowerCase().indexOf(q)>=0||String(u.email||"").toLowerCase().indexOf(q)>=0});
 box.innerHTML=a.length?a.map(function(u,i){return '<div class="u"><button class="ub" data-i="'+i+'"><div class="ur"><span>'+esc(u.name||u.email||"નામ નથી")+'</span><span>'+num(u.plays)+' વાર ›</span></div><div class="um">'+esc(u.email||"")+'</div><div class="um">✓ '+num(u.finishes)+' પૂરી · ⏱ '+dur(u.total_seconds)+' · છેલ્લે '+when(u.last_played)+'</div></button></div>'}).join(""):'<div class="sm">કોઈ મળ્યું નહીં</div>';
 box.querySelectorAll(".ub").forEach(function(b){b.addEventListener("click",function(){openUser(a[+b.dataset.i])})})}
function country(z){if(!z)return "";var M={"Asia/Kolkata":"ભારત","Asia/Calcutta":"ભારત","Pacific/Auckland":"ન્યૂઝીલેન્ડ","Europe/London":"યુ.કે.","Africa/Nairobi":"કેન્યા","Africa/Kampala":"યુગાન્ડા","Africa/Dar_es_Salaam":"ટાન્ઝાનિયા","Asia/Dubai":"યુ.એ.ઈ.","Asia/Singapore":"સિંગાપોર","America/Toronto":"કેનેડા","America/Vancouver":"કેનેડા","America/Edmonton":"કેનેડા","America/Winnipeg":"કેનેડા"};if(M[z])return M[z];if(/^Australia\//.test(z))return "ઑસ્ટ્રેલિયા";if(/^America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Detroit|Boise)$/.test(z))return "અમેરિકા";return z.split("/").pop().replace(/_/g," ")}
function clock(s){var d=new Date(s),p=new Intl.DateTimeFormat("en-GB",{timeZone:"Australia/Adelaide",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);return gu(p)}
function openUser(u){var o=document.createElement("div");o.className="ov";
 o.innerHTML='<div class="wrap"><header><h1>'+esc(u.name||u.email||"નામ નથી")+'</h1><button class="x" aria-label="પાછા">✕</button></header><div class="note">'+esc(u.email||"")+'</div><section class="card"><div class="tiles" style="margin-top:0"><div class="tile" style="border:0;padding:0"><b>'+num(u.plays)+'</b><small>વાર રમ્યા</small></div><div class="tile" style="border:0;padding:0"><b>'+num(u.finishes)+'</b><small>પૂરી કરી</small></div><div class="tile" style="border:0;padding:0"><b>'+dur(u.total_seconds)+'</b><small>કુલ સમય</small></div></div></section><section class="card"><h2>ગેમ પ્રમાણે</h2>'+((u.games||[]).map(function(g){return '<div class="game"><div class="gh"><span>'+esc(GAMES[g.game]||g.game)+'</span><span>'+num(g.plays)+' વાર</span></div><div class="gs"><span>✓ '+num(g.finishes)+' પૂરી</span><span>⏱ '+dur(g.total_seconds)+'</span></div></div>'}).join("")||'<div class="sm">હજી કોઈ ગેમ નથી</div>')+'</section><section class="card"><h2>હિસ્ટ્રી (છેલ્લી ૧૦૦ નોંધ)</h2><div class="hl"><div class="sm">લાવી રહ્યા છીએ…</div></div></section></div>';
 o.querySelector(".x").addEventListener("click",function(){o.remove()});document.body.appendChild(o);
 function fill(list){var e=o.querySelector(".hl");e.innerHTML=list.length?list.map(function(x){var f=x.event==="finish";return '<div class="hd"><span class="ic">'+(f?"✓":"▶")+'</span><span class="tx"><b>'+esc(GAMES[x.game]||x.game)+'</b><small>'+(f?"પૂરી કરી"+(x.duration_seconds?" · "+dur(x.duration_seconds):""):"શરૂ કરી")+'</small></span><span class="tm">'+when(x.played_at)+", "+clock(x.played_at)+(country(x.time_zone)?'<small class="ct">📍 '+esc(country(x.time_zone))+'</small>':'')+'</span></div>'}).join(""):'<div class="sm">હજી કોઈ હિસ્ટ્રી નથી</div>'}
 window.AdminPage.history(u,fill)}
function renderUsers(list){var c=document.createElement("section");c.className="card";c.innerHTML='<h2>ભક્તોની યાદી ('+num(list.length)+')</h2><input class="srch" type="search" placeholder="નામ કે ઈમેઇલથી શોધો" aria-label="શોધો"><div id="ulist"></div>';document.getElementById("app").appendChild(c);c.querySelector("input").addEventListener("input",function(){users(list,this.value)});users(list,"")}
function pct(n,sum){return sum?Math.round(n*100/sum):0}
function renderExtra(x,fb){
 var by={},tot=0;(x.time_zones||[]).forEach(function(z){var c=z.time_zone==="unknown"?UNK:(country(z.time_zone)||UNK);by[c]=(by[c]||0)+z.plays;tot+=z.plays});
 var h='<section class="card"><h2>🌍 દેશ પ્રમાણે</h2>'+(tot?rows(by,{},tot):'<div class="sm">હજી કોઈ ગેમ રમાઈ નથી</div>')+'</section>';
 var hrs=x.by_hour||[],mx=0,mi=0;hrs.forEach(function(r,i){if(r.plays>mx){mx=r.plays;mi=i}});
 h+='<section class="card"><h2>🕘 કયા સમયે રમે છે</h2><div class="read">'+(mx?'<b>'+hour(mi)+'</b> સૌથી વધુ':'હજી આંકડા નથી')+'</div><div class="chart">'+hrs.map(function(r,i){return '<span class="col'+(i===mi&&mx?" on":"")+'"><i style="height:'+(mx?Math.max(2,r.plays*100/mx):2)+'%"></i></span>'}).join("")+'</div><div class="ax"><span>૧૨ રાત</span><span>૧૨ બપોર</span><span>૧૧ રાત</span></div><div class="sm">ભક્તના પોતાના સ્થાનિક સમય પ્રમાણે</div></section>';
 var W=["રવિ","સોમ","મંગળ","બુધ","ગુરુ","શુક્ર","શનિ"],wd=x.by_weekday||[],ws=0,wm=1;wd.forEach(function(r){ws+=r.plays;if(r.plays>wm)wm=r.plays});
 h+='<section class="card"><h2>📅 કયા વારે રમે છે</h2>'+wd.map(function(r){return '<div class="row"><div><span>'+W[r.weekday]+'</span><b>'+gu(pct(r.plays,ws))+'%</b></div><div class="bar"><i style="width:'+pct(r.plays,wm)+'%"></i></div></div>'}).join("")+'</section>';
 var st=x.stars||{},sg=x.stars_by_game||[];
 h+='<section class="card"><h2>⭐ ગેમના તારા</h2>'+(st.count?'<div class="hero"><b>'+gu(st.average)+'</b><span>સરેરાશ ('+num(st.count)+' મત)</span></div>'+sg.map(function(g){return '<div class="gs" style="margin-top:6px"><span>'+esc(GAMES[g.game]||g.game)+'</span><span>⭐ '+gu(g.average)+' ('+num(g.count)+')</span></div>'}).join(""):'<div class="sm">હજી કોઈ મત નથી</div>')+'</section>';
 var I={idea:"💡",bug:"🐞",thanks:"🙏"};
 h+='<section class="card"><h2>💬 ફીડબેક ('+num(x.unread_feedback)+' નવા)</h2><div id="fbl">'+(fb.length?fb.map(function(f,i){return '<div class="hd fb'+(f.is_read?" rd":"")+'" data-i="'+i+'"><span class="ic">'+(I[f.kind]||"💬")+'</span><span class="tx"><b>'+esc(f.name||f.email||"નામ નથી")+(f.game?" · "+esc(GAMES[f.game]||f.game):"")+'</b><small class="ms">'+esc(f.message)+'</small>'+(f.is_read?'':'<button class="mk">✓ વાંચ્યું</button>')+'</span><span class="tm">'+when(f.created_at)+", "+clock(f.created_at)+(country(f.time_zone)?'<small class="ct">📍 '+esc(country(f.time_zone))+'</small>':'')+'</span></div>'}).join(""):'<div class="sm">હજી કોઈ ફીડબેક નથી</div>')+'</div></section>';
 var c=document.createElement("div");c.innerHTML=h;var app=document.getElementById("app");while(c.firstChild)app.appendChild(c.firstChild);
