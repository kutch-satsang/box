.ctitle{font-size:20px;font-weight:700;color:#ffe36a;margin-bottom:10px}
.btn{display:block;width:100%;margin-top:10px;height:48px;border-radius:24px;border:0;font-family:B;font-weight:700;font-size:18px;color:#6a3a00;background:linear-gradient(#fff2a0,#ffc42e 60%,#f0a010);box-shadow:0 4px 0 #b8720c}
.btn.sec{color:#fff;background:linear-gradient(#9d7bff,#5c3bd1);box-shadow:0 4px 0 #3a2297}
.brow{display:flex;gap:10px}.brow .btn{flex:1}
.row{margin:8px 0;font-size:15px;display:block}.row.small{font-size:13px;opacity:.9}
.avgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.avb{border:3px solid transparent;border-radius:16px;background:rgba(255,255,255,.08);padding:6px;color:#fff;font-family:B;font-weight:700}
.avb img{width:100%;height:90px;object-fit:contain}.avb.sel{border-color:#ffe36a;background:rgba(255,227,106,.18)}
.nm{width:100%;margin-top:10px;height:44px;border-radius:14px;border:2px solid #9d7bff;background:#120d33;color:#fff;font-family:B;font-size:17px;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.card{background:rgba(255,255,255,.08);border-radius:12px;padding:5px;font-size:12px;display:flex;flex-direction:column;align-items:center}
.card img{width:52px;height:52px;object-fit:contain}.card img.vv{width:36px;height:36px;margin-top:-6px}.card b{font-size:12px}.card small{font-size:10px;opacity:.8}
.card.lockc img{filter:brightness(0) opacity(.4)}
.wint{font-size:28px;font-weight:700;color:#ffe36a}.wav{width:90px;height:90px;object-fit:contain}
.bigstars{display:flex;justify-content:center;gap:4px}.bigstars svg{width:48px;height:48px}.bigstars svg:nth-child(2){margin-top:-12px}
.tre{margin:8px 0;font-weight:700;color:#c9f1ff}.nc{margin:8px 0;font-size:13px}.nc span{display:inline-flex;align-items:center;gap:2px;margin:3px;padding:2px 6px;border-radius:10px;background:rgba(255,255,255,.1)}.nc img{width:28px;height:28px;object-fit:contain}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#120d33;font-family:B,sans-serif;color:#fff;overflow:hidden}
#app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden}
#scroll{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
#world{position:relative;width:390px;margin:0 auto}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#0f0a2e 0%,#1b1440 10%,#2a1f8f 28%,#3a3fc4 45%,#4f7be8 62%,#9a8de8 78%,#f0a9d6 91%,#ffd2a8 100%)}
.star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.8);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.cloud{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);filter:blur(1.5px)}
.sun{position:absolute;left:150px;width:90px;height:90px;border-radius:50%;background:radial-gradient(#fff,#fff3b0 55%,rgba(255,240,170,0) 72%)}
.tier{position:absolute;left:0;width:390px;pointer-events:none}
.tier img{width:390px;display:block}
.tier.flip img{transform:scaleX(-1)}
.node{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:0;font-family:B;
 display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#6a3a00;cursor:pointer;
 background:radial-gradient(circle at 35% 28%,#fff6c4,#ffc93a 55%,#e8921a);box-shadow:0 2px 0 #b86a0c,0 4px 6px rgba(0,0,0,.35)}
.node.lock{background:radial-gradient(circle at 35% 28%,#e9e6f4,#b5b0cc 60%,#8b86a8);color:#fff;box-shadow:0 2px 0 #6d6890,0 4px 6px rgba(0,0,0,.3)}
.node.cur{width:46px;height:46px;font-size:19px;background:radial-gradient(circle at 35% 28%,#fff,#ffe36a 55%,#ff9d2e);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 14px 8px rgba(255,235,120,.75),0 3px 0 #b86a0c}50%{box-shadow:0 0 0 5px #fff,0 0 26px 14px rgba(255,235,120,.95),0 3px 0 #b86a0c}}
.node.bonus{background:radial-gradient(circle at 35% 28%,#f3d9ff,#b45cf0 58%,#6a1fb5);box-shadow:0 0 0 3px #f0c8ff,0 0 14px 6px rgba(190,110,255,.7),0 3px 0 #4a1388}
.node.bonus.lock{filter:grayscale(.6) brightness(.85)}
.node.boss{width:46px;height:46px;font-size:16px;background:radial-gradient(circle at 35% 28%,#ffd1d1,#ef4d57 58%,#a3182a);color:#fff;box-shadow:0 0 0 3px #ffd36a,0 3px 0 #6e0f1d,0 4px 8px rgba(0,0,0,.4)}
.node.boss.big{width:56px;height:56px}
.node.boss.lock{background:radial-gradient(circle at 35% 28%,#ffe0e0,#c97a80 60%,#8f4c55);box-shadow:0 0 0 3px #e9c2c6,0 3px 0 #5e2a31}
.node.shake{animation:sh .35s}
@keyframes sh{25%{margin-left:-5px}75%{margin-left:5px}}
.stars{position:absolute;transform:translate(-50%,-100%);display:flex;pointer-events:none}
.stars svg{width:11px;height:11px}.stars svg:nth-child(2){margin-top:-4px}
.pin{position:absolute;width:44px;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{margin-top:-6px}}
.av{position:absolute;width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:3px solid #ffe36a;background:#fff3c4;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.bossimg{position:absolute;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff8c8;box-shadow:0 0 6px 2px rgba(255,240,150,.9);transform:translate(-50%,-50%);pointer-events:none}
.dot.off{background:#c9c4e6;box-shadow:none;opacity:.6}
.sym{position:absolute;transform:translate(-50%,-100%);pointer-events:none;transition:filter .4s}
.sym.dim{filter:grayscale(.85) brightness(.72) drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.sym.lit{filter:drop-shadow(0 0 14px rgba(255,230,120,.95)) drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.ftag{position:absolute;transform:translate(-50%,0);font-size:11px;font-weight:700;padding:1px 8px;border-radius:9px;background:rgba(20,14,70,.6);white-space:nowrap;pointer-events:none}
.banner{position:absolute;left:20px;right:20px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;
 background:linear-gradient(#9d7bff,#5c3bd1);box-shadow:0 3px 0 #3a2297,0 6px 14px rgba(0,0,0,.4);border:2px solid #d9c8ff}
.curtain{position:absolute;left:0;right:0;top:0;pointer-events:none;background:linear-gradient(180deg,rgba(225,220,250,.96),rgba(225,220,250,.85) 60%,rgba(225,220,250,0))}
.curtain .cl{position:absolute;border-radius:50%;background:#efeaff}
.lockbub{position:absolute;left:50%;transform:translateX(-50%);width:140px;text-align:center;color:#4a2d8a;font-weight:700}
.lockbub .b{width:78px;height:78px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 35% 30%,#fff,#d9cbff 60%,#9b7fe8);box-shadow:0 0 0 4px #fff,0 0 22px 8px rgba(160,130,255,.7)}
.hud{position:absolute;left:0;right:0;top:0;z-index:50;padding:10px 10px 16px;display:flex;align-items:center;gap:7px;background:linear-gradient(#150f45ee,#150f4500);z-index:50}
.hud .b{width:38px;height:38px;border-radius:50%;background:linear-gradient(#9d7bff,#5c3bd1);box-shadow:0 2px 0 #3a2297;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;border:0;color:#fff;font-family:B}
.hud .face{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:3px solid #c9a7ff;background:#fff3c4}
.hud .t{flex:1;text-align:center;padding:5px 6px;border-radius:16px;background:rgba(30,20,90,.75);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden}
