function render(){

  let CHAL={},MEGA={};try{CHAL=JSON.parse(lsGet('chihnaChal')||'{}')||{};MEGA=JSON.parse(lsGet('chihnaMega')||'{}')||{}}catch(e){}
  f.querySelectorAll('.c,.sp,.pr,.mb').forEach(e=>e.remove());
  let done=0,stages=0,html='';
  // હાલનું (પહેલું અધૂરું) ચિહ્ન
  CH.forEach((c,i)=>{const st=S[i];if(st.rd)done++;stages+=st.d;
    c.s.forEach(([x,y,d],k)=>{
      const sz=Math.max(d*WS*1.6,96);const L=x*W-sz/2,T=y*H-sz/2;
      if(flying===c.id)return; // ઊડતું ચિહ્ન હજુ બેઠું નથી
      const p=.55;const op=st.state==='done'?1:(st.state==='cur'?.45+.55*p:1);
      const cls='c '+st.state+(c.id==='trikon'?' mul':'')+(c.id==='jambu'?' orig':'');
      html+=`<div class="${cls}" data-i="${i}" style="left:${L.toFixed(1)}px;top:${T.toFixed(1)}px;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;${st.state==='cur'?'opacity:'+op.toFixed(2):''}"><img src="h/${c.id}.webp" alt="${c.n}"></div>`;
      if(st.rd)html+=`<div class="sp" style="left:${(x*W+sz*.2).toFixed(1)}px;top:${(y*H-sz*.62).toFixed(1)}px">✨</div>`;
      if(k===0&&st.state==='done'&&CHAL[c.id]>=3)html+=`<div class="sp" style="left:${(x*W-sz*.55).toFixed(1)}px;top:${(y*H-sz*.62).toFixed(1)}px">🏆</div>`+(MEGA[c.id]>0?`<div class="mb" style="left:${(x*W-sz*.5).toFixed(1)}px;top:${(y*H+sz*.3).toFixed(1)}px">🏅${String(MEGA[c.id]).replace(/\d/g,d=>'0123456789'[d])}</div>`:'');
      else if(false)html+=`<div class="pr" style="left:${L.toFixed(1)}px;top:${(T+sz+2).toFixed(1)}px;width:${sz.toFixed(1)}px"><i style="width:${(p*100).toFixed(0)}%"></i></div>`;
    })});
  f.insertAdjacentHTML('beforeend',html);
  const nxt=S.findIndex(s=>!s.rd),rnd=Math.min(11,S[0].m+1);$('nx').textContent=nxt<0?CHL.t('🎉 બધા 11 સ્ટેજ પૂર્ણ','🎉 All 11 stages done','🎉 Badha 11 stej purn'):'🎯 '+CHL.t('સ્ટેજ ','Stage ','Stej ')+rnd+': '+CH[nxt].n;
  $('cnt').textContent=`⭐ ${CHL.t('સ્ટેજ','Stage','Stej')} ${Math.min(11,S[0].m+1)} · ${done} / 16 ${CHL.t('ચિહ્ન','chihna','chihna')}`;
  $('bar').style.width=(done/16*100)+'%';
  $('pts').textContent=getPts().toLocaleString('en-IN');
  window._stat={done,stages};
}
$('f').addEventListener('click',e=>{
  const el=e.target.closest('.c');if(!el)return;
  const i=+el.dataset.i,c=CH[i],st=status(getProg())[i];
  if(!st.unlocked){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');tone(180,.25,0,.15,'square');toast(CHL.t('પહેલાં આગળનું ચિહ્ન પૂરું કરો','Finish the previous chihna first','Pahela aagalnu chihna puru karo'));return}
  tone(660,.15,0,.15);const go=q=>goPage('game','?c='+c.id+q+(TEST?'&test=1':''));
  let CH_L={},MG={};try{CH_L=JSON.parse(lsGet('chihnaChal')||'{}')||{};MG=JSON.parse(lsGet('chihnaMega')||'{}')||{}}catch(e){}
  if(st.state==='done'&&CH_L[c.id]>=3){const nl=(MG[c.id]||0)+1,gn=n=>String(n).replace(/\d/g,d=>'0123456789'[d]);
    openCard(`<h2>${c.n}</h2><div class="x" id="cx">✕</div><div class="row" id="m1" style="margin-top:40px;background:linear-gradient(#ffe27a,#d98a00);color:#5a0036">🏅 ${CHL.t('મહાચેમ્પ લેવલ '+gn(nl)+' રમો','Play MahaChamp level '+nl,'MahaChamp level '+nl+' ramo')}</div><div class="row" id="m2">🏆 ${CHL.t('ચેલેન્જ ફરી','Challenge again','Challenge fari')}</div><div class="row" id="m3">🧩 ${CHL.t('સ્ટેજ ફરી રમો','Replay stages','Stej fari ramo')}</div>`);
    $('cx').onclick=closeCard;$('m1').onclick=()=>go('&ch='+(3+nl));$('m2').onclick=()=>go('&ch=1');$('m3').onclick=()=>go('&s=1');return}
  if(st.state==='rd'){go('&s='+st.d);return}
  go('');
});
$('b1').onclick=()=>stats();$('b2').onclick=()=>rules();

// ===== ઊડીને બેસવાની એનિમેશન =====
function playFly(id,after){
  const i=CH.findIndex(c=>c.id===id);if(i<0)return;
  const c=CH[i],f=$('f');flying=id;render();
  const spots=c.s;let n=0;
  spots.forEach(([x,y,d],k)=>{
    const sz=Math.max(d*WS*1.6,96),L=x*W-sz/2,T=y*H-sz/2;
    const el=document.createElement('div');el.className='fly';
    el.style.cssText=`left:${L}px;top:${T}px;width:${sz}px;height:${sz}px;transform:translate(${(x<.5?-1:1)*120}px,${-(T+420)}px) scale(2.6) rotate(${x<.5?-40:40}deg);opacity:.9`;
    el.innerHTML=`<img src="h/${c.id}.webp" alt="">`;f.appendChild(el);
    void el.offsetWidth;
    if(!animOn()){el.style.transition='none'}
    setTimeout(()=>{el.style.transform='translate(0,0) scale(1) rotate(0)';el.style.opacity='1'},60);
    setTimeout(()=>{ // ઠેકાણે પહોંચ્યું: ✨ ફુવારો
      chime();
      if(animOn())for(let j=0;j<12;j++){const b=document.createElement('div');b.className='burst';b.textContent=j%2?'✨':'⭐';
        b.style.left=(x*W-14)+'px';b.style.top=(y*H-14)+'px';f.appendChild(b);
        const a=j/12*Math.PI*2,r=90+Math.random()*70;
        setTimeout(()=>{b.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(1.4)`;b.style.opacity='0'},30);
        setTimeout(()=>b.remove(),1100)}
      if(++n===spots.length){setTimeout(()=>{el.remove();flying=null;render();after&&after()},animOn()?900:0)}
    },animOn()?1650:80);
  });
}
function checkFly(){
  let id=qs.get('fly');
  if(!id){id=lsGet('chihnaFly');if(id)lsSet('chihnaFly','')}
  if(id&&CH.some(c=>c.id===id)){
    if(qs.get('fly')&&!getProg()[id]){const P=getProg();P[id]=11;setProg(P)} // ટેસ્ટ માટે
    setTimeout(()=>playFly(id,()=>toast('🎉 '+CH.find(c=>c.id===id).n+' ✓')),500)
  }
}

function zoneReward(z){const d=ZR[z-1];if(!d)return;const gn=n=>String(n).replace(/\d/g,x=>'0123456789'[x]);
  let B=[];try{B=JSON.parse(lsGet('chihnaBadges')||'[]')||[]}catch(e){}if(!B.includes(z)){B.push(z);lsSet('chihnaBadges',JSON.stringify(B))}
  const f=$('f');f.classList.add('aura');f.querySelector('.feet').style.filter=`drop-shadow(0 0 26px ${d.c}) drop-shadow(0 0 60px ${d.c}) drop-shadow(0 12px 22px #000a)`;

  if(z>=11){f.querySelector('.feet').style.filter+=' sepia(.6) saturate(2.2) brightness(1.1)'}
  // 16 ચિહ્ન એક પછી એક ચમકે
  const els=[...f.querySelectorAll('.c')];els.forEach((el,k)=>setTimeout(()=>{tone(523+k*40,.18,0,.12);if(animOn()){el.animate([{transform:'scale(1.8)',filter:'brightness(2)'},{transform:'scale(1)',filter:'none'}],{duration:600});
    const rc=el.getBoundingClientRect(),fr=f.getBoundingClientRect(),sc=fr.width/W;for(let j=0;j<4;j++){const b=document.createElement('div');b.className='burst';b.textContent=j%2?'✨':'⭐';
    b.style.left=((rc.left-fr.left)/sc+rc.width/sc/2-14)+'px';b.style.top=((rc.top-fr.top)/sc+rc.height/sc/2-14)+'px';f.appendChild(b);const a=Math.random()*6.3,rr=60+Math.random()*60;
    setTimeout(()=>{b.style.transform=`translate(${Math.cos(a)*rr}px,${Math.sin(a)*rr}px)`;b.style.opacity='0'},30);setTimeout(()=>b.remove(),1100)}}},300+k*170));
  setTimeout(chime,300+16*170);
  $('zgo').onclick=()=>{if(z<11)goPage('map','?enter=1'+(TEST?'&test=1':''));else{r.style.display='none';document.body.classList.remove('zrw')}};

function settings(){const B=(x,c)=>`<i class="ns ${c||''}">${x}</i>`,on=x=>x?B('✓','on'):B('✕'),LG={g:'ગુ',e:'E',r:'ABC'};

   ['↺',CHL.t('પ્રગતિ ફરી શરૂ','Reset progress','Fari sharu'),rc?B(CHL.t('ખરેખર?','Sure?','Kharekhar?'),'rd'):'','rst']];
