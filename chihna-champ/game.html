// ===== સમાપ્તિ: છેલ્લો ટુકડો બેસે એટલે તરત જીત (ઘંટ ફક્ત ફ્રેમનો શણગાર છે) =====
function allPlaced(){done=true;finishedAt=Math.min(T,(Date.now()-startedAt)/1000);over=true;clearInterval(timer);left=T-finishedAt;hud();setTimeout(win,700)}


const RA=['p/rf.webp','p/rb0.webp','p/rb1.webp','p/rb2.webp','p/rb3.webp','p/rb4.webp','p/rs.webp','p/rg.webp','p/rh.webp','p/rr.webp','p/rp.webp'];
// આઇકન-આધારિત (ભાષા વગરનું) પરિણામ કાર્ડ
function resCard(stars,rows,btns){
  const n=rows.length,top=330,avail=660,gap=10,h=Math.min(104,Math.floor((avail-(n-1)*gap)/n)),ic=Math.min(h+8,112),fs=Math.round(h*.52);
  let o=`<img class="rfr" src="${RA[0]}">`;
  [0,1,2].forEach((k,j)=>{o+=`<img class="rst ${k===1?'m':''} ${k<stars?'':'o'}" style="left:${k===1?292:(k===0?92:518)}px" src="${RA[k<stars?6:7]}">`});
  rows.forEach((r,j)=>{o+=`<div class="rw ${r.t?'t':''}" style="top:${top+j*(h+gap)}px;height:${h}px;font-size:${fs}px">`+(r.b!=null?`<img src="${RA[1+r.b]}" style="width:${ic}px">`:`<i style="width:${ic-10}px;height:${ic-10}px;line-height:${ic-18}px;font-size:${Math.round(ic*.5)}px">${r.e}</i>`)+`<span>${r.v}</span>${r.r?`<b>${r.r}</b>`:''}</div>`});
  return o}
function resBtns(btns){const sz=btns.length>3?190:btns.length===3?230:250;let o=`<div class="rbs" id="rbs" style="top:1160px">`;
  btns.forEach((b,i)=>{o+=b.img!=null?`<img id="${b.id}" src="${RA[b.img]}" style="width:${sz}px;animation-delay:${i*.1}s,${.5+i*.1}s">`:`<i id="${b.id}" style="width:${sz-10}px;height:${sz-10}px;font-size:${Math.round(sz*.5)}px;animation-delay:${i*.1}s,${.5+i*.1}s">${b.e}</i>`});
  $('app').insertAdjacentHTML('beforeend',o+'</div>')}
// ===== પરિણામ =====
function win(){
  const rem=Math.max(0,T-finishedAt),timeB=Math.round(rem)*5;const clean=mist===0,fast=finishedAt<=T/2;
  let base=pts+timeB+(clean?200:0)+(fast?300:0);const perfect=clean&&fast;if(perfect)base*=2;
  const stars=mist===0?3:(mist<=2?2:1);
  const WS=mist===0?(+lg('chihnaWin')||0)+1:0;ls('chihnaWin',String(WS));const comboN=WS>0&&WS%3===0?WS:0,comboB=comboN*100;base+=comboB;
  bonusLog={base,timeB,clean,fast,perfect,stars};
  // સાચવવું
  const P=getProg();const old=P[CID]||0;let chihnaDone=false;
  const ST=getStars();ST[CID]=ST[CID]||[];if(!chal)ST[CID][stage-1]=Math.max(ST[CID][stage-1]||0,stars);
  let extra=0;
  let chalX=0;
  let megaB=0,megaT=0;if(ML){const M=getMega(),prev=M[CID]||0;megaB=ML*500;if(ML>prev){M[CID]=ML;ls('chihnaMega',JSON.stringify(M));if(ML%5===0)megaT=2000}}
  if(chal&&!ML){const CHs=getChal(),prev=CHs[CID]||0;if(chal>prev){CHs[CID]=chal;ls('chihnaChal',JSON.stringify(CHs))}if(chal===3&&prev<3)chalX=2000}
  if(!chal&&stage>old){P[CID]=stage;chihnaDone=true;ls('chihnaFly',CID);if(stage>=11)extra=500}
  mem.prog=P;mem.stars=ST;ls('chihnaProg',JSON.stringify(P));ls('chihnaStars',JSON.stringify(ST));
  try{window.sbTrack&&sbTrack.finish({stage:stage,stars:stars,points:base+extra,mistakes:mist,chihna:CID})}catch(e){}
  extra+=chalX+megaB+megaT;const tot=(+lg('chihnaPts')||mem.pts)+base+extra;mem.pts=tot;ls('chihnaPts',String(tot));
  attRec('win',{points:base+extra,stars,combo:comboN});
  if(!chal){try{const R=JSON.parse(lg('chihnaRes')||'{}')||{},k=CID+'_'+stage,o=R[k]||{},t=Math.round(finishedAt);R[k]={s:Math.max(o.s||0,stars),p:Math.max(o.p||0,base+extra),t,b:Math.min(o.b||1e9,t)};ls('chihnaRes',JSON.stringify(R))}catch(e){}}
  const showCard=()=>{sWin();
  if(ML){const R=[{b:0,v:G.slots.length},{b:1,v:Math.round(finishedAt)+'"'}];
    if(clean)R.push({b:2,v:'+200'});if(fast)R.push({b:3,v:'+300'});if(perfect)R.push({b:4,v:'×2'});if(comboN)R.push({e:'🔥',v:'+'+comboB});
    R.push({e:'🏅',v:'+'+megaB});if(megaT)R.push({e:'🏆',v:'+'+megaT});R.push({e:'⭐',v:'+'+(base+extra),t:1});
    openCard(resCard(stars,R),'rc');resBtns([{id:'gh2',img:8},{id:'go',img:10}]);$('go').onclick=()=>startStage(11,chal+1);$('gh2').onclick=()=>location.href=HOME;return}
  const R=[{b:0,v:pts},{b:1,v:'+'+timeB}];
  if(clean)R.push({b:2,v:'+200'});if(fast)R.push({b:3,v:'+300'});if(perfect)R.push({b:4,v:'×2'});
  if(comboN)R.push({e:'🔥',v:'+'+comboB});if(chalX)R.push({e:'🏆',v:'+'+chalX});else if(extra)R.push({e:'🎉',v:'+'+extra});
  R.push({e:'⭐',v:base+extra,t:1});
  const canCh=!chal&&stage===11,chDone=(getChal()[CID]||0)>=3;
  const nextOK=chal?chal<3:true;
  const B=[{id:'gh',img:8},{id:'again',img:9}];if(nextOK)B.push({id:'go',img:10});
  if(chal===3)B.push({id:'mgb',e:'🏅'});if(canCh)B.push({id:'chb',e:'🏆'});
  openCard(resCard(stars,R),'rc');resBtns(B);
  const toV=()=>{location.href=HOME};
  $('gh').onclick=toV;if(nextOK)$('go').onclick=()=>{if(chal)startStage(11,chal+1);else toV()};
  if(canCh)$('chb').onclick=()=>startStage(11,1);if(chal===3)$('mgb').onclick=()=>startStage(11,4+(getMega()[CID]||0));
  $('again').onclick=()=>startStage(stage,chal);
  };
  const steps=[{t:'🧩',n:pts,cum:pts}];let cum=pts;
  if(timeB>0){cum+=timeB;steps.push({t:'⏱',n:timeB,cum})}
  if(clean){cum+=200;steps.push({t:'✨',n:200,cum})}
  if(fast){cum+=300;steps.push({t:'⚡',n:300,cum})}
  if(perfect){cum*=2;steps.push({t:'💎',txt:'×2',cum,big:1,rain:1})}
  if(comboN){cum+=comboB;steps.push({t:'🔥 ×'+comboN,n:comboB,cum,big:1,rain:1,img:1})}
  if(ML){cum+=megaB;steps.push({t:'🏅 '+ML,n:megaB,cum,big:1,rain:1});if(megaT){cum+=megaT;steps.push({t:'🏆',n:megaT,cum,big:1,rain:1})}}
  else if(extra){cum+=extra;steps.push({t:chalX?'🏆':'🎉',n:extra,cum,big:1,rain:1})}
  celebrate(steps,showCard);
}
// ===== બોનસની ઉજવણી: એક પછી એક લખાણ, ✨ ફુવારો, ટેપ કરો તો આગળ =====
function sparkBurst(cx,cy,n){for(let j=0;j<n;j++){const b=document.createElement('div');b.className='sk';b.style.cssText=`left:${cx-20}px;top:${cy-20}px;font-size:${34+Math.random()*26|0}px;transition:transform 1s ease-out,opacity 1s`;b.textContent=j%2?'✨':'⭐';$('app').appendChild(b);const a=j/n*Math.PI*2,r=180+Math.random()*220;setTimeout(()=>{b.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(1.4)`;b.style.opacity='0'},30);setTimeout(()=>b.remove(),1100)}}
function sparkRain(n){for(let j=0;j<n;j++){const b=document.createElement('div');b.className='sk';b.style.cssText=`left:${Math.random()*880|0}px;top:-70px;font-size:${38+Math.random()*34|0}px;transition:transform ${1.3+Math.random()*.9}s ease-in,opacity 2s`;b.textContent=j%2?'✨':'⭐';$('app').appendChild(b);setTimeout(()=>{b.style.transform=`translateY(${1500+Math.random()*200|0}px) rotate(${Math.random()*360|0}deg)`},30+j*40);setTimeout(()=>b.remove(),2800+j*40)}}
function celebrate(steps,fin){
  const ov=$('celeb');let i=0,tm=null,cd=null,off=false;const t0=Date.now();
  ov.style.display='block';
  function stop(){off=true;clearTimeout(tm);clearInterval(cd);ov.style.display='none';ov.innerHTML=''}
  window.celebCancel=()=>{if(!off)stop()};
  function end(){if(off)return;stop();fin()}
  ov.onclick=()=>{if(Date.now()-t0>400)end()};
  function next(){
    if(off)return;
    if(i>=steps.length){tm=setTimeout(end,250);return}
    const s=steps[i++],an=animOn();
    ov.innerHTML=`<div class="cbn ${an?'in':''}">${s.img?`<div class="cmbb"><img src="h/combo.png"><span>${s.t}</span></div>`:`<div class="t">${s.t}</div>`}<div class="v" id="cv">${s.txt!=null?s.txt:'+'+s.n}</div><div class="ct">પુણ્ય ${s.cum}</div></div>`;
    const f=523*Math.pow(2,(i-1)*2/12);tone(f,.3,0,.2);tone(f*1.5,.25,.08,.12);
    if(s.n!=null&&an){const st=Date.now();clearInterval(cd);$('cv').textContent='+0';cd=setInterval(()=>{const k=Math.min(1,(Date.now()-st)/450);$('cv').textContent='+'+Math.round(s.n*k);if(k>=1)clearInterval(cd)},30)}
    if(an){sparkBurst(470,720,s.big?20:10);if(s.rain)sparkRain(24)}
    tm=setTimeout(next,an?1000:700)}
  next()}
function fail(){ls('chihnaWin','0');over=true;clearInterval(timer);attRec('timeup');sBad();
  openCard(`<h2>⏱ સમય પૂરો</h2><div class="big">😔</div><div class="txt" style="text-align:center">${placed} / ${G.slots.length} ટુકડા બેસ્યા.<br>ફરી પ્રયત્ન કરો!</div><div class="btn" id="again">ફરી રમો</div><div class="btn g" id="gh">ઝોનમાં</div>`);
  $('again').onclick=()=>startStage(stage,chal);$('gh').onclick=()=>location.href=HOME}

// ===== હિન્ટ, ઝલક =====
$('hint').onclick=()=>{if(over||done)return;if(hintsLeft<=0)return toast('હિન્ટ પૂરી');const un=G.slots.map((s,i)=>i).filter(i=>!G.slots[i].ok);const i=un[Math.random()*un.length|0];
  hintsLeft--;$('hc').textContent=hintsLeft;pts=Math.max(0,pts-50);hud();G.slots[i].el.classList.add('hl');const k=G.tray.indexOf(i);G.scroll=Math.max(0,Math.min(G.max,14+k*(G.tw+G.gap)-300));$('tin').style.transform=`translateX(${-G.scroll}px)`;const tp=$('tin').querySelector(`[data-i="${i}"]`);tp.classList.add('hint');pop('−50',G.box.x+G.box.w/2,G.box.y+60,'#ff9aa8');setTimeout(()=>{G.slots[i].el.classList.remove('hl');tp.classList.remove('hint')},2800)};
$('pk').onclick=()=>{if(over||done)return;if(peeksLeft<=0)return toast('ચિત્ર પૂરું');peeksLeft--;$('pc').textContent=peeksLeft;pts=Math.max(0,pts-100);hud();pop('−100',G.box.x+G.box.w/2,G.box.y+60,'#ff9aa8');const p=$('peek');p.classList.add('on');setTimeout(()=>p.classList.remove('on'),1600)};

// ===== બોક્સ =====
function openCard(h,cls){const q=$('sp');if(q)q.style.display='none';const c=$('card');c.className='card'+(cls?' '+cls:'');c.innerHTML=h;const ob=$('rbs');if(ob)ob.remove();c.style.display='block';$('dim').style.display='block'}
function closeCard(){const ob=$('rbs');if(ob)ob.remove();if(pausedAt){startedAt+=Date.now()-pausedAt;pausedAt=null}const q=$('sp');if(q)q.style.display='none';$('card').style.display='none';$('dim').style.display='none'}
const SPY=[279,401,521,640,752,864,980];
function panel(rows){let p=$('sp');if(!p){p=document.createElement('div');p.id='sp';$('app').appendChild(p)}
 p.innerHTML='<div class="spx" id="spx"></div>'+rows.map((r,i)=>`<div class="spl" style="top:${SPY[i]-40}px">${r.label}</div>`+(r.pill?`<div class="spp ${r.pill.c}" style="top:${SPY[i]-33}px">${r.pill.t}</div>`:'')+`<div class="sph" id="sh${i}" style="top:${SPY[i]-60}px"></div>`).join('');
 p.style.display='block';$('dim').style.display='block';$('card').style.display='none';$('spx').onclick=closeCard;rows.forEach((r,i)=>$('sh'+i).onclick=r.fn)}
function settings(){const on=x=>x?{t:'ચાલુ',c:'on'}:{t:'બંધ',c:'off'};
  panel([
   {label:'અવાજ',pill:on(soundOn()),fn:()=>{ls('satsangSound',soundOn()?'0':'1');settings();tone(660,.15)}},
   {label:'ભાષા',pill:{t:'ગુજરાતી',c:'lg'},fn:()=>toast('ભાષા હજુ ફક્ત ગુજરાતીમાં છે')},
   {label:'એનિમેશન',pill:on(animOn()),fn:()=>{ls('chihnaAnim',animOn()?'0':'1');document.body.classList.toggle('noanim',!animOn());settings()}},
   {label:'આંકડા',fn:()=>{const P=getProg();const st=Object.values(P).reduce((a,b)=>a+b,0);const dn=Object.values(P).filter(v=>v>=11).length;sub('📊 આંકડા',`<p>⭐ ચિહ્ન પૂર્ણ: <b>${dn} / 16</b></p><p>🧩 સ્ટેજ પૂર્ણ: <b>${st} / 176</b></p><p>🏆 કુલ પોઇન્ટ: <b>${(+lg('chihnaPts')||mem.pts).toLocaleString('en-IN')}</b></p>`)}},
   {label:'નિયમો અને પોઇન્ટ',fn:()=>sub('📜 નિયમો','<p>• સાચો ટુકડો 100 / 200 / 300 (સળંગ સાચા)</p><p>• 🔥 સળંગ 3 કોયડા ભૂલ વગર અને સમયમાં પૂરા કરો તો કોમ્બો બોનસ (+300, +600 …)</p><p>• ખોટો −20 · હિન્ટ −50 (2 હિન્ટ) · 🖼️ ચિત્ર −100 (2 વાર)</p><p>• ⏱ બાકી સમય ×5 · ✨ ભૂલ વગર +200</p><p>• ⚡ અડધા સમયમાં +300 · 💎 બંને હોય તો ×2</p><p>• 🏆 ચિહ્નના 11 કોયડા પછી 3 ચેલેન્જ: સમય ઓછો, ટુકડા વધુ. ત્રણેય જીતો તો +2000</p>')},
   {label:'જાહેરાત',fn:()=>sub('📣 જાહેરાત','<p>હાલ કોઈ નવી જાહેરાત નથી.</p>')},
   {label:'પ્રગતિ ફરી શરૂ',pill:rc?{t:'ખરેખર?',c:'rd'}:null,fn:reset}])}
function sub(t,body){openCard(`<h2>${t}</h2><div class="txt">${body}</div><div class="btn g" id="bk">‹ પાછા</div>`);$('bk').onclick=settings}
let rc=false;
function reset(){if(!rc){rc=true;settings();setTimeout(()=>{rc=false;const q=$('sp');if(q&&q.style.display==='block')settings()},3000);return}
  rc=false;mem.prog={};mem.stars={};mem.pts=0;ls('chihnaProg','{}');ls('chihnaStars','{}');ls('chihnaPts','0');ls('chihnaWin','0');ls('chihnaChal','{}');ls('chihnaMega','{}');ls('chihnaFly','');closeCard();toast('પ્રગતિ ફરી શરૂ થઈ');startStage(1)}
$('set').onclick=()=>{if(!over&&!pausedAt)pausedAt=Date.now();settings()};$('dim').onclick=()=>{if(!over)closeCard()};
$('home').onclick=()=>{attLeft();location.href=HOME};
