<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
@font-face{font-family:G;src:url(../h/f.woff2)}
*{box-sizing:border-box}
html,body{margin:0;width:390px;height:844px;overflow:hidden;font-family:G,'Baloo Bhai 2',sans-serif;color:#fff;background:#3a0230}
#bg{position:fixed;inset:0;background:linear-gradient(#3a0a3fcc,#5a0f4ecc),url(../m/bg1.jpg) center/cover}
#dim{position:fixed;inset:0;background:#1a0018b3}
.card{position:absolute;left:35px;top:110px;width:320px;height:607px;background:url(../p/mn/panel.webp) center/100% 100% no-repeat;filter:drop-shadow(0 8px 18px #000a)}
.ttl{position:absolute;left:60px;right:60px;top:75px;transform:translateY(-50%);text-align:center;font-size:24px;font-weight:800;text-shadow:0 2px 3px #7a0040}
.x{position:absolute;right:-8px;top:-14px;width:46px;height:46px;background:url(../p/mn/gem.webp) center/contain no-repeat;display:grid;place-items:center;font-size:20px;font-weight:800;text-shadow:0 2px 2px #7a0040}
.r{position:absolute;left:42px;width:236px;height:76px;background:url(../p/mn/pill_n.webp) center/100% 100% no-repeat}
.r .i{position:absolute;left:28px;top:16px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:23px}
.r .t{position:absolute;left:86px;right:24px;top:38px;transform:translateY(-50%);line-height:1.05}
.r .t small{display:block;font-size:13px;font-weight:600;color:#ffe1f1}
.r .t b{display:block;font-size:22px;font-weight:800;text-shadow:0 2px 2px #7a0040;margin-top:2px}
.r .t b span{font-size:14px;color:#ffd6ec}
.bk{position:absolute;left:95px;top:486px;width:130px;height:46px;border-radius:23px;background:linear-gradient(#ffe27a,#ffad2e);border:3px solid #fff3c4;color:#7a0040;font-size:19px;font-weight:800;display:grid;place-items:center;box-shadow:0 3px 0 #b25a00}
</style></head><body><div id="bg"></div><div id="dim"></div>
<div class="card">
 <div class="ttl">આંકડા</div><div class="x">✕</div>
 <div class="r" style="top:140px"><div class="i">🏘️</div><div class="t"><small>ઝોન પૂર્ણ</small><b>2 <span>/ 11</span></b></div></div>
 <div class="r" style="top:222px"><div class="i">🏠</div><div class="t"><small>આ ઝોનનાં ઘર</small><b>9 <span>/ 16</span></b></div></div>
 <div class="r" style="top:304px"><div class="i">🧩</div><div class="t"><small>સ્ટેજ પૂર્ણ</small><b>41 <span>/ 176</span></b></div></div>
 <div class="r" style="top:386px"><div class="i">🏆</div><div class="t"><small>કુલ પોઇન્ટ</small><b>18,450</b></div></div>
 <div class="bk">‹ પાછા</div>
</div></body></html>
