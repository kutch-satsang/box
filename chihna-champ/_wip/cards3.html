<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="base.css"><style>
html,body{background:#3a0230}
.r{position:absolute;left:42px;width:236px;height:76px;background:url(../p/mn/pill_n.webp) center/100% 100% no-repeat}
.r .i{position:absolute;left:28px;top:16px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:23px}
.r .t{position:absolute;left:86px;right:24px;top:38px;transform:translateY(-50%);line-height:1.05}
.r .t small{display:block;font-size:13px;font-weight:600;color:#ffe1f1;white-space:nowrap}
.r .t b{display:block;font-size:22px;font-weight:800;text-shadow:0 2px 2px #7a0040;margin-top:2px}
.r .t b span{font-size:14px;color:#ffd6ec}
.ln{position:absolute;left:44px;right:44px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;line-height:1.25}
.ln i{flex:0 0 40px;height:40px;background:url(../p/mn/ring_g.webp) center/contain no-repeat;display:grid;place-items:center;font-style:normal;font-size:18px}
.sep{position:absolute;left:50px;right:50px;top:394px;height:34px;background:url(../p/mn/bar_t.webp) center/100% 100% no-repeat;text-align:center;font-size:15px;font-weight:800;line-height:34px;text-shadow:0 2px 2px #7a0040}
.pt{position:absolute;left:44px;right:44px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;padding:0 6px;height:30px;border-bottom:1px solid #ffc94a44}
.pt b{color:#ffe27a;font-size:16px;white-space:nowrap}
.z{position:absolute;left:30px;width:300px;height:88px;background:url(../p/mn/pill_n.webp) center/100% 100% no-repeat}
.z.g{background-image:url(../p/mn/pill_g.webp);height:106px;margin-top:-9px}
.z.d{background-image:url(../p/mn/pill_d.webp);height:90px}
.z .i{position:absolute;left:30px;top:18px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px}
.z.g .i{top:27px}
.z .n{position:absolute;left:100px;right:30px;top:25px;font-size:14px;font-weight:800;text-shadow:0 2px 2px #7a0040;white-space:nowrap}
.z.g .n{top:33px}.z.g .b,.z.g .s{margin-top:9px}
.z .s{position:absolute;right:32px;top:25px;display:flex;gap:1px}.z .s img{width:16px}
.z .b{position:absolute;left:102px;right:36px;top:52px;height:12px;border-radius:7px;background:#5a0636;border:2px solid #ffc94a;overflow:hidden}
.z .b u{display:block;height:100%;background:linear-gradient(90deg,#ffe27a,#ffad2e)}
.z .bt{position:absolute;right:36px;top:66px;font-size:11px;font-weight:700;color:#ffe1f1}
.z.d .n,.z.d .i{opacity:.75}
.z .lk{position:absolute;right:34px;top:30px;width:32px}
.pg{position:absolute;left:0;right:0;top:620px;display:flex;justify-content:center;gap:14px;align-items:center;font-size:15px;font-weight:800}
.pg span{width:38px;height:38px;background:url(../p/mn/gem.webp) center/contain no-repeat;display:grid;place-items:center;text-shadow:0 2px 2px #7a0040}
</style></head><body><div id="bg"></div><div id="dim"></div><div id="app"></div>
<script>
const Q=new URLSearchParams(location.search),L=Q.get('lang')||'g',C=Q.get('card')||'stats';
const T={
g:{stats:'રેકોર્ડ',rules:'નિયમો',zones:'ઝોન',back:'‹ પાછા',s1:'ઝોન પૂર્ણ',s2:'આ ઝોનનાં ઘર',s3:'સ્ટેજ પૂર્ણ',s4:'કુલ પોઇન્ટ',pts:'પોઇન્ટ',
 r:['દરેક ઝોનમાં 16 ઘર, દરેક ઘરમાં એક ચિહ્નની પઝલ','લીલું ▶ દબાવો: અવતાર ઘરમાં જાય, પઝલ ખૂલે','પૂરું ઘર દબાવો: તારા, પોઇન્ટ અને સમય','16 ઘર પછી ગેટ ખૂલે, ચરણ પર ઇનામ'],
 p:['સાચો ટુકડો','ખોટો ટુકડો','ભૂલ વગર','અડધા સમયમાં'],
 z:['કમળ વન','તુલસી વન','ગંગા કિનારો','સૂર્ય નગર','ચંદ્ર બાગ','મોર બાગ']},
e:{stats:'Record',rules:'Rules',zones:'Zones',back:'‹ Back',s1:'Zones done',s2:'Houses in this zone',s3:'Stages done',s4:'Total points',pts:'Points',
 r:['16 houses in every zone, one chihna puzzle in each house','Press the green ▶: avatar enters the house, puzzle opens','Press a finished house: stars, points and time','After 16 houses the gate opens, prize on the charan'],
 p:['Correct','Wrong','No mistakes','Half the time'],
 z:['Lotus Grove','Tulsi Forest','Ganga Shore','Sun City','Moon Garden','Peacock Garden']},
r:{stats:'Record',rules:'Niyamo',zones:'Zon',back:'‹ Pachha',s1:'Zon purn',s2:'Aa zonna ghar',s3:'Stej purn',s4:'Kul point',pts:'Point',
 r:['Darek zonma 16 ghar, darek gharma ek chihnani puzzle','Lilu ▶ dabavo: avatar gharma jay, puzzle khule','Puru ghar dabavo: tara, point ane samay','16 ghar pachi gate khule, charan par inam'],
 p:['Sacho','Khoto','Bhul vagar','Adha samay'],
 z:['Kamal Van','Tulsi Van','Ganga Kinaro','Surya Nagar','Chandra Baag','Mor Baag']}
}[L];
const S=n=>`<img src="../p/mn/star${n?'':'_e'}.webp">`;
let h='';
if(C=='stats'){
 const R=(t,i,s,v,o)=>`<div class="r" style="top:${t}px"><div class="i">${i}</div><div class="t"><small>${s}</small><b>${v}${o?` <span>/ ${o}</span>`:''}</b></div></div>`;
 h=`<div class="card" style="left:35px;top:110px;width:320px;height:607px"><div class="ttl" style="top:75px">${T.stats}</div><div class="x">✕</div>`+
 R(140,'🏘️',T.s1,2,11)+R(222,'🏠',T.s2,9,16)+R(304,'🧩',T.s3,41,176)+R(386,'🏆',T.s4,'18,450')+
 `<div class="bk" style="left:95px;top:486px">${T.back}</div></div>`;
}else if(C=='rules'){
 h=`<div class="card" style="left:35px;top:95px;width:320px;height:640px"><div class="ttl" style="top:78px">${T.rules}</div><div class="x">✕</div>`+
 ['🏠','▶','⭐','🚪'].map((ic,k)=>`<div class="ln" style="top:${140+62*k}px"><i>${ic}</i>${T.r[k]}</div>`).join('')+
 `<div class="sep">${T.pts}</div>`+
 [['🧩','100 / 200 / 300'],['❌','−20'],['✨','+200'],['⚡','+300']].map((a,k)=>`<div class="pt" style="top:${438+32*k}px${k==3?';border:0':''}"><span>${a[0]} ${T.p[k]}</span><b>${a[1]}</b></div>`).join('')+
 `<div class="bk" style="left:95px;top:580px">${T.back}</div></div>`;
}else{
 const ic=['🪷','🌿','🌊','🌅','🌙','🦚'];
 const row=(k)=>{const t=128+80*k,n=`${k+1} · ${T.z[k]}`;
  if(k==0)return `<div class="z" style="top:${t}px"><div class="i">${ic[k]}</div><div class="n">${n}</div><div class="s">${S(1)+S(1)+S(1)}</div><div class="b"><u style="width:100%"></u></div><div class="bt">16/16</div></div>`;
  if(k==1)return `<div class="z g" style="top:${t}px"><div class="i">${ic[k]}</div><div class="n">${n}</div><div class="s">${S(1)+S(0)+S(0)}</div><div class="b"><u style="width:56%"></u></div><div class="bt">9/16</div></div>`;
  return `<div class="z d" style="top:${t}px"><div class="i">${ic[k]}</div><div class="n">${n}</div><img class="lk" src="../p/mn/lock.webp"></div>`;};
 h=`<div class="card" style="left:15px;top:60px;width:360px;height:724px"><div class="ttl" style="top:86px">${T.zones}</div><div class="x">✕</div>`+[0,1,2,3,4,5].map(row).join('')+`<div class="pg"><span>‹</span>1 / 3<span>›</span></div></div>`;
}
document.getElementById('app').innerHTML=h;
</script></body></html>
