let rc=false;
function settings(){const on=x=>x?{t:'ચાલુ',c:'on'}:{t:'બંધ',c:'off'};
  panel([{label:'અવાજ',pill:on(soundOn()),fn:()=>{lsSet('satsangSound',soundOn()?'0':'1');settings();tone(660,.15)}},
   {label:'એનિમેશન',pill:on(animOn()),fn:()=>{lsSet('chihnaAnim',animOn()?'0':'1');document.body.classList.toggle('noanim',!animOn());settings()}},
   {label:'ચરણ (16 ચિહ્ન)',fn:()=>goPage('charan','?'+PQ.slice(1))},
   {label:t().lang,pill:{t:t().lg,c:'lg'},fn:()=>{const o=['g','e','r'];window.SatsangBox&&SatsangBox.set('lang',o[(o.indexOf(L())+1)%3])}},
   {label:'નિયમો અને પોઇન્ટ',fn:rules},
   {label:'જાહેરાત',fn:()=>sub('📣 જાહેરાત','<p>હાલ કોઈ નવી જાહેરાત નથી.</p>')},
   {label:'પ્રગતિ ફરી શરૂ',pill:rc?{t:'ખરેખર?',c:'rd'}:null,fn:reset}])}
function sub(t,body){openCard(`<h2>${t}</h2><div class="x" id="cx">✕</div><div class="txt">${body}</div><div class="row" id="bk" style="margin-top:28px">‹ પાછા<b class="g">⚙️</b></div>`);$('cx').onclick=closeCard;$('bk').onclick=settings}
let lastCard=null;
function nOpen(fn,html){lastCard=fn;const q=$('sp');if(q)q.style.display='none';$('card').style.display='none';$('dim').style.display='none';$('nw').innerHTML=html;$('nov').style.display='block'}
$('nw').onclick=e=>{e.stopPropagation();if(e.target.closest('[data-x]'))closeCard();else if(e.target.closest('[data-bk]'))settings()};
$('nov').onclick=e=>{if(e.target.id==='nov')closeCard()};
function stats(){const s=window._stat||{},P=getProg(),m=minDone(P),T=t();
  const R=(y,i,l,v,o)=>`<div class="nr" style="top:${y}px"><div class="i">${i}</div><div class="t"><small>${l}</small><b>${v}${o?` <span>/ ${o}</span>`:''}</b></div></div>`;
  nOpen(stats,`<div class="nc" style="left:35px;top:110px;width:320px;height:607px"><div class="nt" style="top:75px">${T.stats}</div><div class="nx" data-x="1">✕</div>`+
   R(140,'🏘️',T.s1,GN(m),11)+R(222,'🏠',T.s2,GN(s.done||0),16)+R(304,'🧩',T.s3,GN(s.stages||0),176)+R(386,'🏆',T.s4,getPts().toLocaleString('en-IN'))+
   `<div class="nbk" data-bk="1" style="left:95px;top:486px">${T.back}</div></div>`)}
function rules(){const T=t();
  nOpen(rules,`<div class="nc" style="left:35px;top:95px;width:320px;height:640px"><div class="nt" style="top:78px">${T.rules}</div><div class="nx" data-x="1">✕</div>`+
   ['🏠','▶','⭐','🚪'].map((ic,k)=>`<div class="nl" style="top:${140+62*k}px"><i>${ic}</i>${T.r[k]}</div>`).join('')+`<div class="nsep">${T.pts}</div>`+
   [['🧩','100 / 200 / 300'],['❌','−20'],['✨','+200'],['⚡','+300']].map((a,k)=>`<div class="np" style="top:${438+32*k}px${k==3?';border:0':''}"><span>${a[0]} ${T.p[k]}</span><b>${a[1]}</b></div>`).join('')+
   `<div class="nbk" data-bk="1" style="left:95px;top:580px">${T.back}</div></div>`)}
function reset(){if(!rc){rc=true;settings();setTimeout(()=>{rc=false},3000);return}
  rc=false;['chihnaProg','chihnaStars','chihnaChal','chihnaMega','chihnaRes'].forEach(k=>lsSet(k,'{}'));lsSet('chihnaPts','0');lsSet('chihnaFly','');lsSet('chihnaZoneSeen','0');closeCard();VIEW=1;render();avAtCurrent();toast('પ્રગતિ ફરી શરૂ થઈ')}
$('set').onclick=settings;$('b1').onclick=stats;$('b2').onclick=rules;
$('home').onclick=()=>{location.href='index.html'+(TEST?'?test=1':'')};
if(TEST)$('tb').style.display='block';

window.SatsangBox&&SatsangBox.onChange(k=>{if(k!=='lang')return;render();const q=$('sp');if(q&&q.style.display==='block')settings();if($('nov').style.display==='block'&&lastCard)lastCard();if($('zov').style.display==='block')zRender()});

// ===== સ્ક્રીનમાં બેસાડવું અને શરૂઆત =====
function fit(){const s=Math.min(innerWidth/BW,innerHeight/BH),a=$('app');a.style.transform=`scale(${s})`;a.style.left=((innerWidth-BW*s)/2)+'px';a.style.top=((innerHeight-BH*s)/2)+'px'}
addEventListener('resize',fit);fit();document.body.classList.toggle('noanim',!animOn());
if(qs.get('demo')){const P={};CH.forEach((c,i)=>P[c.id]=i<13?1:0);lsSet('chihnaProg',JSON.stringify(P))}
(function(){
  const list=['m/bg1.jpg','m/h_gold.webp','m/h_normal.webp','m/h_lock.webp','m/road.jpg','m/plat.webp','m/av_idle.webp','m/av_cheer.webp','p/set.jpg','p/mn/panel.webp','p/mn/pill_n.webp','p/mn/pill_g.webp','p/mn/pill_d.webp','p/mn/gem.webp','p/mn/ring_g.webp','p/mn/bar_t.webp','p/mn/star.webp','p/mn/star_e.webp','p/mn/lock.webp'].concat(AVF,AVB,AVS,CH.map(c=>'h/'+c.id+'.webp'));
  let n=0,shown=false;
  function show(){if(shown)return;shown=true;buildPath();const P=getProg();VIEW=+qs.get('z')||Math.min(11,minDone(P)+1);render();$('app').classList.add('on');$('ld').classList.add('off');afterReturn();openFromMenu()}
  list.forEach(u=>{const im=new Image();const d=()=>{n++;$('lbar').style.width=(n/list.length*100)+'%';if(n>=list.length)show()};im.onload=d;im.onerror=d;im.src=u});
  setTimeout(show,9000);
})();
</script></body></html>
