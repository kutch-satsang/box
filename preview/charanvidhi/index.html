8\u0AC7 \u0AA6\u0AB0\u0AC7\u0A95\u0AA8\u0AC7 <b>\u0AAC\u0AC7 \u0A98\u0ABE</b> \u0A9C\u0ACB\u0A88\u0A8F. \u0AAA\u0AA5\u0ACD\u0AA5\u0AB0\u0AA8\u0AC7 \u0A98\u0ABE \u0A95\u0AB0\u0AB5\u0ABE \u0AA4\u0AC7\u0AA8\u0AC0 \u0AAC\u0ABE\u0A9C\u0AC1\u0AAE\u0ABE\u0A82 \u0A9C \u0AAE\u0AC7\u0A9A \u0AAC\u0AA8\u0ABE\u0AB5\u0ACB. \u0AB8\u0A82\u0A96\u0ACD\u0AAF\u0ABE \u0AAC\u0AA4\u0ABE\u0AB5\u0AC7 \u0A9B\u0AC7 \u0A95\u0AC7 \u0A95\u0AC7\u0A9F\u0AB2\u0ABE \u0A98\u0ABE \u0AAC\u0ABE\u0A95\u0AC0 \u0A9B\u0AC7."],["Toughest stones","\u0AB8\u0ACC\u0AA5\u0AC0 \u0AAE\u0A9C\u0AAC\u0AC2\u0AA4 \u0AAA\u0AA5\u0ACD\u0AA5\u0AB0\u0ACB"],["Some stones now need <b>three hits</b>. The number on a stone shows how many hits are left.","\u0AB9\u0AB5\u0AC7 \u0A95\u0AC7\u0A9F\u0AB2\u0ABE\u0A95 \u0AAA\u0AA5\u0ACD\u0AA5\u0AB0\u0ACB\u0AA8\u0AC7 <b>\u0AA4\u0ACD\u0AB0\u0AA3 \u0A98\u0ABE</b> \u0A9C\u0ACB\u0A88\u0A8F. \u0AAA\u0AA5\u0ACD\u0AA5\u0AB0 \u0AAA\u0AB0\u0AA8\u0AC0 \u0AB8\u0A82\u0A96\u0ACD\u0AAF\u0ABE \u0AAC\u0AA4\u0ABE\u0AB5\u0AC7 \u0A9B\u0AC7 \u0A95\u0AC7 \u0A95\u0AC7\u0A9F\u0AB2\u0ABE \u0A98\u0ABE \u0AAC\u0ABE\u0A95\u0AC0 \u0A9B\u0AC7."],["Glow cells","\u0A9A\u0AAE\u0A95\u0AA4\u0ABE \u0A96\u0ABE\u0AA8\u0ABE\u0A82"],["A <b>glowing cell</b> shines under a chihna. Make a match that clears a chihna on it to switch the glow off. Switch off every glow to win.","\u0A9A\u0ABF\u0AB9\u0ACD\u0AA8\u0AA8\u0AC0 \u0AA8\u0AC0\u0A9A\u0AC7 <b>\u0A9A\u0AAE\u0A95\u0AA4\u0AC1\u0A82 \u0A96\u0ABE\u0AA8\u0AC1\u0A82</b> \u0AB9\u0ACB\u0AAF \u0A9B\u0AC7. \u0AA4\u0AC7\u0AA8\u0ABE \u0AAA\u0AB0\u0AA8\u0AC1\u0A82 \u0A9A\u0ABF\u0AB9\u0ACD\u0AA8 \u0AB9\u0A9F\u0AC7 \u0A8F\u0AB5\u0ACB \u0AAE\u0AC7\u0A9A \u0AAC\u0AA8\u0ABE\u0AB5\u0ACB \u0A8F\u0A9F\u0AB2\u0AC7 \u0A9A\u0AAE\u0A95 \u0AAC\u0A82\u0AA7 \u0AA5\u0AB6\u0AC7. \u0A9C\u0AC0\u0AA4\u0AB5\u0ABE \u0AAE\u0ABE\u0A9F\u0AC7 \u0AAC\u0AA7\u0AC0 \u0A9A\u0AAE\u0A95 \u0AAC\u0A82\u0AA7 \u0A95\u0AB0\u0ACB."],["Double glow","\u0AAC\u0AC7\u0AB5\u0AA1\u0AC0 \u0A9A\u0AAE\u0A95"],["A cell with <b>two glowing rings</b> needs two matches before it is switched off.","<b>\u0AAC\u0AC7 \u0A9A\u0AAE\u0A95\u0AA4\u0ABE \u0AB5\u0AB0\u0ACD\u0AA4\u0AC1\u0AB3</b> \u0AB5\u0ABE\u0AB3\u0ABE \u0A96\u0ABE\u0AA8\u0ABE\u0AA8\u0AC7 \u0AAC\u0A82\u0AA7 \u0A95\u0AB0\u0AB5\u0ABE \u0AAC\u0AC7 \u0AAE\u0AC7\u0A9A \u0A9C\u0ACB\u0A88\u0A8F."],["Cages","\u0AAA\u0ABE\u0A82\u0A9C\u0AB0\u0ABE\u0A82"],["A <b>caged chihna</b> can't be swapped or moved. Match it with the chihnas next to it to set it free.","\u0AAA\u0ABE\u0A82\u0A9C\u0AB0\u0ABE\u0AAE\u0ABE\u0A82 \u0AB0\u0AB9\u0AC7\u0AB2\u0AC1\u0A82 <b>\u0A9A\u0ABF\u0AB9\u0ACD\u0AA8</b> \u0A85\u0AA6\u0AB2\u0ABE\u0AAC\u0AA6\u0AB2\u0AC0 \u0A95\u0AC7 \u0A96\u0AB8\u0AC7\u0AA1\u0AC0 \u0AB6\u0A95\u0ABE\u0AA4\u0AC1\u0A82 \u0AA8\u0AA5\u0AC0. \u0AA4\u0AC7\u0AA8\u0AC7 \u0A9B\u0ACB\u0AA1\u0ABE\u0AB5\u0AB5\u0ABE \u0AA4\u0AC7\u0AA8\u0AC0 \u0AAC\u0ABE\u0A9C\u0AC1\u0AA8\u0ABE \u0A9A\u0ABF\u0AB9\u0ACD\u0AA8\u0ACB \u0AB8\u0ABE\u0AA5\u0AC7 \u0AAE\u0AC7\u0A9A \u0AAC\u0AA8\u0ABE\u0AB5\u0ACB."],["Diamonds","\u0AB9\u0AC0\u0AB0\u0ABE"],["<b>Diamonds</b> can't be swapped. Clear the tiles under a diamond so it drops. When it reaches the bottom of its column it is yours.","<b>\u0AB9\u0AC0\u0AB0\u0ABE\u0AA8\u0AC0</b> \u0A85\u0AA6\u0AB2\u0ABE\u0AAC\u0AA6\u0AB2\u0AC0 \u0AA5\u0A88 \u0AB6\u0A95\u0AA4\u0AC0 \u0AA8\u0AA5\u0AC0. \u0AB9\u0AC0\u0AB0\u0ABE\u0AA8\u0AC0 \u0AA8\u0AC0\u0A9A\u0AC7\u0AA8\u0AC0 \u0A9F\u0ABE\u0A87\u0AB2 \u0AB9\u0A9F\u0ABE\u0AB5\u0ACB \u0A8F\u0A9F\u0AB2\u0AC7 \u0AA4\u0AC7 \u0AA8\u0AC0\u0A9A\u0AC7 \u0AAA\u0AA1\u0AC7. \u0AA4\u0AC7\u0AA8\u0AC0 \u0A95\u0AC9\u0AB2\u0AAE\u0AA8\u0ABE \u0AA4\u0AB3\u0ABF\u0AAF\u0AC7 \u0AAA\u0AB9\u0ACB\u0A82\u0A9A\u0AC7 \u0AA4\u0ACD\u0AAF\u0ABE\u0AB0\u0AC7 \u0AA4\u0AC7 \u0AA4\u0AAE\u0ABE\u0AB0\u0ACB."],["Moss","\u0AB6\u0AC7\u0AB5\u0ABE\u0AB3"],["<b>Moss</b> sits under the tiles. Clear a tile on it to remove it. If two moves in a row clear no moss, the moss <b>spreads</b> by one cell. Clear it all!","<b>\u0AB6\u0AC7\u0AB5\u0ABE\u0AB3</b> \u0A9F\u0ABE\u0A87\u0AB2\u0AA8\u0AC0 \u0AA8\u0AC0\u0A9A\u0AC7 \u0AB9\u0ACB\u0AAF \u0A9B\u0AC7. \u0AA4\u0AC7\u0AA8\u0ABE \u0AAA\u0AB0\u0AA8\u0AC0 \u0A9F\u0ABE\u0A87\u0AB2 \u0AB9\u0A9F\u0ABE\u0AB5\u0ACB \u0A8F\u0A9F\u0AB2\u0AC7 \u0AB6\u0AC7\u0AB5\u0ABE\u0AB3 \u0A9C\u0ABE\u0AAF. \u0AB8\u0AB3\u0A82\u0A97 \u0AAC\u0AC7 \u0A9A\u0ABE\u0AB2\u0AAE\u0ABE\u0A82 \u0A95\u0ACB\u0A88 \u0AB6\u0AC7\u0AB5\u0ABE\u0AB3 \u0AA8 \u0AB9\u0A9F\u0AC7 \u0AA4\u0ACB \u0AB6\u0AC7\u0AB5\u0ABE\u0AB3 \u0A8F\u0A95 \u0A96\u0ABE\u0AA8\u0AC1\u0A82 <b>\u0AAB\u0AC7\u0AB2\u0ABE\u0AAF</b> \u0A9B\u0AC7. \u0AAC\u0AA7\u0AC0 \u0AB8\u0ABE\u0AAB \u0A95\u0AB0\u0ACB!"],["Countdown","\u0A95\u0ABE\u0A89\u0AA8\u0ACD\u0A9F\u0AA1\u0ABE\u0A89\u0AA8"],["A chihna with a <b>number</b> is on a countdown. Match it before the number reaches zero. The number goes down after every move.","<b>\u0AB8\u0A82\u0A96\u0ACD\u0AAF\u0ABE</b> \u0AB5\u0ABE\u0AB3\u0AC1\u0A82 \u0A9A\u0ABF\u0AB9\u0ACD\u0AA8 \u0A95\u0ABE\u0A89\u0AA8\u0ACD\u0A9F\u0AA1\u0ABE\u0A89\u0AA8 \u0AAA\u0AB0 \u0A9B\u0AC7. \u0AB8\u0A82\u0A96\u0ACD\u0AAF\u0ABE \u0AB6\u0AC2\u0AA8\u0ACD\u0AAF \u0AA5\u0ABE\u0AAF \u0AA4\u0AC7 \u0AAA\u0AB9\u0AC7\u0AB2\u0ABE\u0A82 \u0AA4\u0AC7\u0AA8\u0ACB \u0AAE\u0AC7\u0A9A \u0AAC\u0AA8\u0ABE\u0AB5\u0ACB. \u0AA6\u0AB0\u0AC7\u0A95 \u0A9A\u0ABE\u0AB2 \u0AAA\u0A9B\u0AC0 \u0AB8\u0A82\u0A96\u0ACD\u0AAF\u0ABE \u0A98\u0A9F\u0AC7 \u0A9B\u0AC7."],["Row and column clearers","\u0AAA\u0A82\u0A95\u0ACD\u0AA4\u0ABF \u0A85\u0AA8\u0AC7 \u0AB8\u0ACD\u0AA4\u0A82\u0AAD \u0AB8\u0ABE\u0AAB \u0A95\u0AB0\u0AA8\u0ABE\u0AB0"],["Match <b>4 in a line</b> to make one. Swipe <b>left or right</b> to make a row clearer (\u2194) and <b>up or down</b> to make a column clearer (\u2195). Match it, or swap it with another special, to clear its whole row or column.","\u0AAC\u0AA8\u0ABE\u0AB5\u0AB5\u0ABE \u0AAE\u0ABE\u0A9F\u0AC7 <b>\u0AB2\u0ABE\u0A87\u0AA8\u0AAE\u0ABE\u0A82 4</b> \u0AAE\u0AC7\u0A9A \u0A95\u0AB0\u0ACB. <b>\u0AA1\u0ABE\u0AAC\u0AC7 \u0A95\u0AC7 \u0A9C\u0AAE\u0AA3\u0AC7</b> \u0AB8\u0ACD\u0AB5\u0ABE\u0A87\u0AAA \u0A95\u0AB0\u0ACB \u0AA4\u0ACB \u0AAA\u0A82\u0A95\u0ACD\u0AA4\u0ABF \u0AB8\u0ABE\u0AAB \u0A95\u0AB0\u0AA8\u0ABE\u0AB0 (\u2194) \u0AAC\u0AA8\u0AC7 \u0A85\u0AA8\u0AC7 <b>\u0A89\u0AAA\u0AB0 \u0A95\u0AC7 \u0AA8\u0AC0\u0A9A\u0AC7</b> \u0AB8\u0ACD\u0AB5\u0ABE\u0A87\u0AAA \u0A95\u0AB0\u0ACB \u0AA4\u0ACB \u0AB8\u0ACD\u0AA4\u0A82\u0AAD \u0AB8\u0ABE\u0AAB \u0A95\u0AB0\u0AA8\u0ABE\u0AB0 (\u2195) \u0AAC\u0AA8\u0AC7. \u0AA4\u0AC7\u0AA8\u0ACB \u0AAE\u0AC7\u0A9A \u0A95\u0AB0\u0ACB \u0A85\u0AA5\u0AB5\u0ABE \u0AAC\u0AC0\u0A9C\u0AC0 \u0A96\u0ABE\u0AB8 \u0A9F\u0ABE\u0A87\u0AB2 \u0AB8\u0ABE\u0AA5\u0AC7 \u0A85\u0AA6\u0AB2\u0ABE\u0AAC\u0AA6\u0AB2\u0AC0 \u0A95\u0AB0\u0ACB, \u0A8F\u0A9F\u0AB2\u0AC7 \u0AA4\u0AC7\u0AA8\u0AC0 \u0A86\u0A96\u0AC0 \u0AAA\u0A82\u0A95\u0ACD\u0AA4\u0ABF \u0A95\u0AC7 \u0AB8\u0ACD\u0AA4\u0A82\u0AAD \u0AB8\u0ABE\u0AAB \u0AA5\u0AB6\u0AC7."],["Burst","\u0AA7\u0AA1\u0ABE\u0A95\u0ACB"],["Match in an <b>L or T shape</b> to make a burst (\u2738). When it goes off it clears all the tiles around it.","<b>L \u0A95\u0AC7 T \u0A86\u0A95\u0ABE\u0AB0\u0AAE\u0ABE\u0A82</b> \u0AAE\u0AC7\u0A9A \u0A95\u0AB0\u0ACB \u0AA4\u0ACB \u0AA7\u0AA1\u0ABE\u0A95\u0ACB (\u2738) \u0AAC\u0AA8\u0AC7. \u0AA4\u0AC7 \u0AAB\u0AC2\u0A9F\u0AC7 \u0AA4\u0ACD\u0AAF\u0ABE\u0AB0\u0AC7 \u0A86\u0AB8\u0AAA\u0ABE\u0AB8\u0AA8\u0AC0 \u0AAC\u0AA7\u0AC0 \u0A9F\u0ABE\u0A87\u0AB2 \u0AB8\u0ABE\u0AAB \u0AA5\u0ABE\u0AAF."],["Star","\u0AA4\u0ABE\u0AB0\u0ACB"],["Match <b>5 in a line</b> to make a star (\u2726). Swap it with any chihna to clear every tile of that chihna on the board.","<b>\u0AB2\u0ABE\u0A87\u0AA8\u0AAE\u0ABE\u0A82 5</b> \u0AAE\u0AC7\u0A9A \u0A95\u0AB0\u0ACB \u0AA4\u0ACB \u0AA4\u0ABE\u0AB0\u0ACB (\u2726) \u0AAC\u0AA8\u0AC7. \u0A95\u0ACB\u0A88 \u0AAA\u0AA3 \u0A9A\u0ABF\u0AB9\u0ACD\u0AA8 \u0AB8\u0ABE\u0AA5\u0AC7 \u0A85\u0AA6\u0AB2\u0ABE\u0AAC\u0AA6\u0AB2\u0AC0 \u0A95\u0AB0\u0ACB \u0AA4\u0ACB \u0AAC\u0ACB\u0AB0\u0ACD\u0AA1 \u0AAA\u0AB0\u0AA8\u0AC0 \u0AA4\u0AC7 \u0A9A\u0ABF\u0AB9\u0ACD\u0AA8\u0AA8\u0AC0 \u0AAC\u0AA7\u0AC0 \u0A9F\u0ABE\u0A87\u0AB2 \u0AB8\u0ABE\u0AAB \u0AA5\u0ABE\u0AAF."],["Special combinations","\u0A96\u0ABE\u0AB8 \u0AB8\u0A82\u0AAF\u0ACB\u0A9C\u0AA8\u0ACB"],["Swap <b>two special tiles</b> together for a bigger effect: two clearers make a cross, a clearer and a burst make a giant cross, two bursts make a big burst, and a star turns every tile of the other special's chihna into that special. Two stars clear the whole board!","<b>\u0AAC\u0AC7 \u0A96\u0ABE\u0AB8 \u0A9F\u0ABE\u0A87\u0AB2</b>\u0AA8\u0AC0 \u0A85\u0AA6\u0AB2\u0ABE\u0AAC\u0AA6\u0AB2\u0AC0 \u0A95\u0AB0\u0ACB \u0AA4\u0ACB \u0AAE\u0ACB\u0A9F\u0AC0 \u0A85\u0AB8\u0AB0 \u0AA5\u0ABE\u0AAF: \u0AAC\u0AC7 \u0AB8\u0ABE\u0AAB \u0A95\u0AB0\u0AA8\u0ABE\u0AB0 \u0AAE\u0AB3\u0AC0\u0AA8\u0AC7 \u0A95\u0ACD\u0AB0\u0ACB\u0AB8 \u0AAC\u0AA8\u0AC7, \u0AB8\u0ABE\u0AAB \u0A95\u0AB0\u0AA8\u0ABE\u0AB0 \u0A85\u0AA8\u0AC7 \u0AA7\u0AA1\u0ABE\u0A95\u0ACB \u0AAE\u0AB3\u0AC0\u0AA8\u0AC7 \u0AB5\u0ABF\u0AB6\u0ABE\u0AB3 \u0A95\u0ACD\u0AB0\u0ACB\u0AB8 \u0AAC\u0AA8\u0AC7, \u0AAC\u0AC7 \u0AA7\u0AA1\u0ABE\u0A95\u0ABE \u0AAE\u0AB3\u0AC0\u0AA8\u0AC7 \u0AAE\u0ACB\u0A9F\u0ACB \u0AA7\u0AA1\u0ABE\u0A95\u0ACB \u0AAC\u0AA8\u0AC7, \u0A85\u0AA8\u0AC7 \u0AA4\u0ABE\u0AB0\u0ACB \u0AAC\u0AC0\u0A9C\u0AC0 \u0A96\u0ABE\u0AB8 \u0A9F\u0ABE\u0A87\u0AB2\u0AA8\u0ABE \u0A9A\u0ABF\u0AB9\u0ACD\u0AA8\u0AA8\u0AC0 \u0AAC\u0AA7\u0AC0 \u0A9F\u0ABE\u0A87\u0AB2\u0AA8\u0AC7 \u0AA4\u0AC7 \u0A96\u0ABE\u0AB8 \u0A9F\u0ABE\u0A87\u0AB2\u0AAE\u0ABE\u0A82 \u0AAB\u0AC7\u0AB0\u0AB5\u0AC7. \u0AAC\u0AC7 \u0AA4\u0ABE\u0AB0\u0ABE \u0A86\u0A96\u0AC1\u0A82 \u0AAC\u0ACB\u0AB0\u0ACD\u0AA1 \u0AB8\u0ABE\u0AAB \u0A95\u0AB0\u0AC7!"],["Resume","\u0A9A\u0ABE\u0AB2\u0AC1 \u0AB0\u0ABE\u0A96\u0ACB"],["Restart level {n}","\u0AB2\u0AC7\u0AB5\u0AB2 {1} \u0AAB\u0AB0\u0AC0 \u0AB6\u0AB0\u0AC2 \u0A95\u0AB0\u0ACB"],["Restarting or leaving now costs a life. A restart gives a fresh board with the same goal and moves.","\u0AB9\u0AAE\u0AA3\u0ABE\u0A82 \u0AAB\u0AB0\u0AC0 \u0AB6\u0
